<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#0b0b0f"
    >

    <meta
        name="description"
        content="Messie IA - Assistant intelligent avec génération et modification d'images"
    >

    <title>Messie IA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b0b0f;
            --panel: #111116;
            --panel-2: #17171e;
            --panel-3: #1d1d26;
            --border: #2b2b35;
            --text: #f5f5f7;
            --muted: #a4a4ad;
            --accent: #b95cff;
            --accent-2: #8f36e8;
            --danger: #ff4d5e;
            --success: #42d392;
            --shadow: 0 12px 40px rgba(0,0,0,.35);
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           APP
        ===================================================== */

        .app {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(11,11,15,.94);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(15px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                var(--accent),
                var(--accent-2)
            );
            color: white;
            font-size: 20px;
            font-weight: 800;
            box-shadow: 0 6px 20px rgba(185,92,255,.25);
        }

        .brand-name {
            font-size: 19px;
            font-weight: 700;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 11px;
            margin-top: 1px;
        }

        .header-actions {
            display: flex;
            gap: 7px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .icon-btn:active {
            transform: scale(.96);
        }

        /* =====================================================
           NAVIGATION
        ===================================================== */

        .tabs {
            display: flex;
            gap: 6px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex: 0 0 auto;
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted);
            padding: 10px 15px;
            border-radius: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .tab.active {
            color: white;
            background: var(--panel-3);
            border-color: var(--border);
        }

        /* =====================================================
           CONTENT
        ===================================================== */

        .content {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 18px 14px 100px;
            flex: 1;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .welcome {
            text-align: center;
            padding: 24px 8px 20px;
        }
