<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messie IA</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #020617
                );

            color: white;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 15px;
        }

        .app {
            width: 100%;
            max-width: 850px;

            height: 90vh;
            max-height: 850px;

            background: rgba(15, 23, 42, 0.97);

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 25px;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            box-shadow:
                0 25px 80px rgba(0,0,0,0.5);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            padding: 15px 18px;

            background:
                rgba(2, 6, 23, 0.98);

            border-bottom:
                1px solid rgba(255,255,255,0.08);

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;
        }


        .logo {
            display: flex;

            align-items: center;

            gap: 11px;

            min-width: 0;
        }


        .logo-icon {
            width: 45px;
            height: 45px;

            min-width: 45px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            font-size: 22px;

            font-weight: bold;
        }


        .logo-text {
            min-width: 0;
        }


        .logo-text h1 {
            font-size: 20px;
        }


        .logo-text p {
            font-size: 12px;

            color: #94a3b8;

            margin-top: 3px;
        }


        .header-buttons {
            display: flex;

            gap: 7px;
        }


        .header-button {
            border: none;

            color: #cbd5e1;

            background: #1e293b;

            border-radius: 10px;

            padding: 9px 11px;

            font-size: 12px;

            cursor: pointer;
        }


        .header-button:hover {
            background: #334155;
        }


        /* =====================================================
           CHAT
        ===================================================== */

        .chat {
            flex: 1;

            overflow-y: auto;

            padding: 25px 18px;

            scroll-behavior: smooth;
        }


        .welcome {
            text-align: center;

            padding: 45px 15px;
        }


        .welcome-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            border-radius: 50%;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 32px;
            font-weight: bold;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );
        }


        .welcome h2 {
            font-size: 28px;

            margin-bottom: 10px;
        }


        .welcome p {
            color: #94a3b8;

            line-height: 1.6;
        }


        /* =====================================================
           MESSAGES
        ===================================================== */

        .message {
            display: flex;

            margin-bottom: 20px;

            width: 100%;
        }


        .message.user {
            justify-content: flex-end;
        }


        .message.ai {
            justify-content: flex-start;
        }


        .bubble {
            max-width: 85%;

            padding: 13px 16px;

            border-radius: 18px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-wrap: break-word;

            overflow-wrap: break-word;

            font-size: 15px;
        }


        .user .bubble {
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            border-bottom-right-radius: 5px;
        }


        .ai .bubble {
            background: #1e293b;

            border:
                1px solid
                rgba(255,255,255,0.06);

            border-bottom-left-radius: 5px;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading-message {
            display: flex;

            justify-content: flex-start;

            margin-bottom: 20px;
        }


        .loading-bubble {
            background: #1e293b;

            border:
                1px solid
                rgba(255,255,255,0.06);

            border-radius: 18px;

            border-bottom-left-radius: 5px;

            padding: 15px 18px;
        }


        .loading {
            display: flex;

            align-items: center;

            gap: 5px;
        }


        .loading-text {
            color: #94a3b8;

            font-size: 13px;

            margin-right: 7px;
        }


        .loading span {
            width: 7px;
            height: 7px;

            background: #94a3b8;

            border-radius: 50%;

            animation: bounce 1.2s infinite;
        }


        .loading span:nth-child(3) {
            animation-delay: .15s;
        }


        .loading span:nth-child(4) {
            animation-delay: .3s;
        }


        @keyframes bounce {

            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-6px);
            }

        }


        /* =====================================================
           INPUT
        ===================================================== */

        .input-area {
            padding: 15px;

            background:
                rgba(2, 6, 23, 0.98);

            border-top:
                1px solid
                rgba(255,255,255,0.08);
        }


        .input-box {
            display: flex;

            align-items: flex-end;

            gap: 10px;

            background: #1e293b;

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 18px;

            padding: 8px;
        }


        textarea {
            flex: 1;

            resize: none;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            font-size: 15px;

            padding: 10px;

            min-height: 45px;

            max-height: 140px;

            font-family: inherit;
        }


        textarea::placeholder {
            color: #64748b;
        }


        #sendButton {
            width: 45px;
            height: 45px;

            min-width: 45px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            color: white;

            font-size: 18px;

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: pointer;
        }


        #sendButton:hover {
            opacity: .9;
        }


        #sendButton:disabled {
            opacity: .5;

            cursor: not-allowed;
        }


        .info {
            text-align: center;

            color: #64748b;

            font-size: 11px;

            margin-top: 8px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 0;
            }


            .app {
                width: 100%;

                height: 100vh;

                max-height: none;

                border-radius: 0;
            }


            .header {
                padding: 13px;
            }


            .logo-icon {
                width: 42px;
                height: 42px;

                min-width: 42px;
            }


            .logo-text h1 {
                font-size: 18px;
            }


            .logo-text p {
                font-size: 11px;
            }


            .header-button {
                padding: 8px;

                font-size: 11px;
            }


            .chat {
                padding: 18px 13px;
            }


            .welcome {
                padding-top: 55px;
            }


            .welcome h2 {
                font-size: 24px;
            }


            .bubble {
                max-width: 90%;

                font-size: 15px;
            }


            .input-area {
                padding: 10px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">


        <div class="logo">

            <div class="logo-icon">
                M
            </div>


            <div class="logo-text">

                <h1>
                    Messie IA
                </h1>

                <p>
                    Ton assistant intelligent
                </p>

            </div>

        </div>


        <div class="header-buttons">

            <button
                class="header-button"
                id="newChatButton"
                type="button"
            >
                + Nouveau
            </button>


            <button
                class="header-button"
                id="clearButton"
                type="button"
            >
                🗑️
            </button>

        </div>


    </header>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <main
        class="chat"
        id="chat"
    >

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-icon">
                M
            </div>

            <h2>
                Bonjour 👋
            </h2>

            <p>
                Je suis Messie IA.<br>
                Pose-moi une question pour commencer.
            </p>

        </div>

    </main>


    <!-- =====================================================
         INPUT
    ====================================================== -->

    <div class="input-area">


        <div class="input-box">


            <textarea
                id="messageInput"
                placeholder="Écris ton message..."
                rows="1"
                autocomplete="off"
            ></textarea>


            <button
                id="sendButton"
                type="button"
                aria-label="Envoyer"
            >
                ➤
            </button>


        </div>


        <div class="info">
            Messie IA peut parfois faire des erreurs.
        </div>


    </div>


</div>


<script>

    /* ========================================================
       CONFIGURATION
    ======================================================== */

    const STORAGE_KEY = "messie_ia_conversation";


    /* ========================================================
       ÉLÉMENTS HTML
    ======================================================== */

    const chat = document.getElementById("chat");

    const welcome = document.getElementById("welcome");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const clearButton =
        document.getElementById("clearButton");

    const newChatButton =
        document.getElementById("newChatButton");


    /* ========================================================
       HISTORIQUE
    ======================================================== */

    let conversation = [];


    /* ========================================================
       CHARGER L'HISTORIQUE
    ======================================================== */

    function loadConversation() {

        try {

            const saved =
                localStorage.getItem(STORAGE_KEY);


            if (!saved) {

                conversation = [];

                return;
            }


            const parsed =
                JSON.parse(saved);


            if (Array.isArray(parsed)) {

                conversation = parsed.filter(item => {

                    return (
                        item &&
                        (
                            item.role === "user" ||
                            item.role === "assistant"
                        ) &&
                        typeof item.content === "string"
                    );

                });

            } else {

                conversation = [];

            }

        } catch (error) {

            console.error(
                "Erreur lors du chargement de l'historique :",
                error
            );

            conversation = [];
        }

    }


    /* ========================================================
       SAUVEGARDER L'HISTORIQUE
    ======================================================== */

    function saveConversation() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(conversation)
            );

        } catch (error) {

            console.error(
                "Impossible de sauvegarder la conversation :",
                error
            );

        }

    }


    /* ========================================================
       SUPPRIMER LES MENTIONS SAFETY
    ======================================================== */

    function cleanAIResponse(text) {

        if (!text) {
            return "";
        }


        let cleaned = String(text);


        /*
         * Supprimer les lignes du genre :
         *
         * User Safety: safe
         * Response Safety: safe
         */

        cleaned = cleaned.replace(
            /user\s*safety\s*:\s*safe/gi,
            ""
        );


        cleaned = cleaned.replace(
            /response\s*safety\s*:\s*safe/gi,
            ""
        );


        cleaned = cleaned.replace(
            /user\s*safety\s*:/gi,
            ""
        );


        cleaned = cleaned.replace(
            /response\s*safety\s*:/gi,
            ""
        );


        /*
         * Supprimer également certaines variantes.
         */

        cleaned = cleaned.replace(
            /^\s*safe\s*$/gim,
            ""
        );


        /*
         * Nettoyer les lignes vides répétées.
         */

        cleaned = cleaned.replace(
            /\n{3,}/g,
            "\n\n"
        );


        return cleaned.trim();

    }


    /* ========================================================
       ÉCHAPPER LE HTML
    ======================================================== */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    /* ========================================================
       AFFICHER UN MESSAGE
    ======================================================== */

    function addMessage(role, content) {

        if (!content) {
            return;
        }


        if (welcome) {

            welcome.style.display = "none";
        }


        const message =
            document.createElement("div");


        message.className =
            role === "user"
                ? "message user"
                : "message ai";


        const bubble =
            document.createElement("div");


        bubble.className = "bubble";


        bubble.innerHTML =
            escapeHTML(content);


        message.appendChild(bubble);


        chat.appendChild(message);


        scrollToBottom();

    }


    /* ========================================================
       AFFICHER TOUT L'HISTORIQUE
    ======================================================== */

    function renderConversation() {

        /*
         * Supprimer tous les messages actuels
         * sans supprimer le welcome.
         */

        const messages =
            chat.querySelectorAll(".message");


        messages.forEach(message => {

            message.remove();

        });


        if (conversation.length === 0) {

            if (welcome) {

                welcome.style.display = "block";

            }

            return;
        }


        if (welcome) {

            welcome.style.display = "none";

        }


        conversation.forEach(item => {

            addMessage(
                item.role,
                item.content
            );

        });


        scrollToBottom();

    }


    /* ========================================================
       SCROLL VERS LE BAS
    ======================================================== */

    function scrollToBottom() {

        setTimeout(() => {

            chat.scrollTop =
                chat.scrollHeight;

        }, 50);

    }


    /* ========================================================
       AFFICHER LE CHARGEMENT
    ======================================================== */

    function showLoading() {

        removeLoading();


        const loadingMessage =
            document.createElement("div");


        loadingMessage.id =
            "loadingMessage";


        loadingMessage.className =
            "loading-message";


        loadingMessage.innerHTML = `

            <div class="loading-bubble">

                <div class="loading">

                    <span class="loading-text">
                        Messie IA réfléchit
                    </span>

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        `;


        chat.appendChild(
            loadingMessage
        );


        scrollToBottom();

    }


    /* ========================================================
       SUPPRIMER LE CHARGEMENT
    ======================================================== */

    function removeLoading() {

        const loading =
            document.getElementById(
                "loadingMessage"
            );


        if (loading) {

            loading.remove();

        }

    }


    /* ========================================================
       ENVOYER LE MESSAGE
    ======================================================== */

    async function sendMessage() {

        const message =
            messageInput.value.trim();


        if (!message) {
            return;
        }


        /*
         * Empêcher plusieurs requêtes simultanées.
         */

        sendButton.disabled = true;

        messageInput.disabled = true;


        /*
         * Afficher le message utilisateur.
         */

        addMessage(
            "user",
            message
        );


        /*
         * Ajouter le message à l'historique.
         */

        conversation.push({

            role: "user",

            content: message

        });


        saveConversation();


        /*
         * Vider le champ.
         */

        messageInput.value = "";

        autoResize();


        /*
         * Afficher le chargement.
         */

        showLoading();


        try {

            /*
             * Envoyer l'historique complet
             * au backend Python.
             *
             * On envoie conversation.slice(0, -1)
             * car le backend ajoute lui-même
             * le nouveau message.
             */

            const history =
                conversation.slice(0, -1);


            const response =
                await fetch(
                    "/api/chat",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            message: message,

                            history: history

                        })

                    }
                );


            let data;


            try {

                data =
                    await response.json();

            } catch (error) {

                throw new Error(
                    "Le serveur a renvoyé une réponse invalide."
                );

            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Une erreur est survenue."
                );

            }


            /*
             * Récupérer la réponse.
             */

            let answer =
                data.response || "";


            /*
             * IMPORTANT :
             * retirer User Safety / Response Safety.
             */

            answer =
                cleanAIResponse(answer);


            if (!answer) {

                answer =
                    "Je n'ai pas reçu de réponse valide.";
            }


            /*
             * Ajouter la réponse de Messie IA.
             */

            conversation.push({

                role: "assistant",

                content: answer

            });


            saveConversation();


            removeLoading();


            addMessage(
                "assistant",
                answer
            );


        } catch (error) {

            console.error(
                "Erreur :",
                error
            );


            removeLoading();


            const errorMessage =
                "Désolé, une erreur est survenue. " +
                error.message;


            addMessage(
                "assistant",
                errorMessage
            );


            /*
             * On ne conserve pas le message d'erreur
             * comme une réponse normale de l'IA.
             */

        } finally {

            sendButton.disabled = false;

            messageInput.disabled = false;

            messageInput.focus();

        }

    }


    /* ========================================================
       NOUVELLE CONVERSATION
    ======================================================== */

    function newConversation() {

        const confirmed =
            confirm(
                "Commencer une nouvelle conversation ?"
            );


        if (!confirmed) {
            return;
        }


        conversation = [];


        saveConversation();


        renderConversation();


        messageInput.focus();

    }


    /* ========================================================
       EFFACER L'HISTORIQUE
    ======================================================== */

    function clearHistory() {

        const confirmed =
            confirm(
                "Voulez-vous supprimer définitivement " +
                "l'historique de cette conversation ?"
            );


        if (!confirmed) {
            return;
        }


        conversation = [];


        localStorage.removeItem(
            STORAGE_KEY
        );


        renderConversation();


        messageInput.focus();

    }


    /* ========================================================
       AGRANDIR AUTOMATIQUEMENT TEXTAREA
    ======================================================== */

    function autoResize() {

        messageInput.style.height =
            "auto";


        const newHeight =
            Math.min(
                messageInput.scrollHeight,
                140
            );


        messageInput.style.height =
            newHeight + "px";

    }


    /* ========================================================
       ÉVÉNEMENTS
    ======================================================== */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    clearButton.addEventListener(
        "click",
        clearHistory
    );


    newChatButton.addEventListener(
        "click",
        newConversation
    );


    messageInput.addEventListener(
        "input",
        autoResize
    );


    /*
     * Envoyer avec Entrée.
     *
     * Shift + Entrée = nouvelle ligne.
     */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* ========================================================
       INITIALISATION
    ======================================================== */

    loadConversation();

    renderConversation();

    autoResize();


</script>


</body>

    </html>
