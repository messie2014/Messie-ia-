<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Messie IA</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #020617
                );

            color: white;

            min-height: 100vh;

            overflow: hidden;
        }

        button {
            font-family: inherit;
        }

        /* =====================================================
           APPLICATION
        ===================================================== */

        .app {
            width: 100%;
            height: 100vh;

            background: #020617;

            display: flex;
            flex-direction: column;

            position: relative;

            overflow: hidden;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            height: 75px;

            padding: 12px 18px;

            background:
                rgba(2, 6, 23, 0.97);

            border-bottom:
                1px solid rgba(255,255,255,0.08);

            display: flex;

            align-items: center;

            justify-content: space-between;

            flex-shrink: 0;

            z-index: 10;
        }


        .logo {
            display: flex;

            align-items: center;

            gap: 11px;

            min-width: 0;
        }


        .logo-icon {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            font-size: 21px;

            font-weight: bold;
        }


        .logo-text {
            min-width: 0;
        }


        .logo-text h1 {
            font-size: 19px;

            white-space: nowrap;
        }


        .logo-text p {
            font-size: 11px;

            color: #94a3b8;

            margin-top: 3px;
        }


        /* =====================================================
           HEADER BUTTONS
        ===================================================== */

        .header-buttons {
            display: flex;

            align-items: center;

            gap: 7px;
        }


        .header-button {
            border: none;

            color: white;

            background: #111827;

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 11px;

            height: 40px;

            padding: 0 11px;

            cursor: pointer;

            font-size: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 5px;
        }


        .header-button:hover {
            background: #1e293b;
        }


        .header-button.new {
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            border: none;
        }


        /* =====================================================
           CHAT
        ===================================================== */

        .chat {
            flex: 1;

            overflow-y: auto;

            overflow-x: hidden;

            padding: 25px 18px 20px;

            scroll-behavior: smooth;

            -webkit-overflow-scrolling: touch;
        }


        .chat::-webkit-scrollbar {
            width: 6px;
        }


        .chat::-webkit-scrollbar-thumb {
            background: #334155;

            border-radius: 10px;
        }


        /* =====================================================
           WELCOME
        ===================================================== */

        .welcome {
            text-align: center;

            padding: 55px 15px 40px;
        }


        .welcome-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 18px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            font-size: 34px;

            font-weight: bold;

            box-shadow:
                0 10px 35px
                rgba(37,99,235,0.25);
        }


        .welcome h2 {
            font-size: 27px;

            margin-bottom: 10px;
        }


        .welcome p {
            color: #94a3b8;

            line-height: 1.6;

            max-width: 500px;

            margin: auto;
        }


        /* =====================================================
           MESSAGES
        ===================================================== */

        .message {
            display: flex;

            margin-bottom: 20px;

            width: 100%;
        }


        .message.user {
            justify-content: flex-end;
        }


        .message.ai {
            justify-content: flex-start;
        }


        .bubble {
            max-width: 85%;

            padding: 14px 17px;

            border-radius: 18px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-wrap: break-word;

            overflow-wrap: anywhere;

            font-size: 15px;
        }


        .user .bubble {
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            border-bottom-right-radius: 5px;
        }


        .ai .bubble {
            background: #0f172a;

            border:
                1px solid
                rgba(255,255,255,0.07);

            border-bottom-left-radius: 5px;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            display: flex;

            gap: 5px;

            align-items: center;

            min-height: 20px;
        }


        .loading span {
            width: 7px;
            height: 7px;

            background: #94a3b8;

            border-radius: 50%;

            animation: bounce 1.2s infinite;
        }


        .loading span:nth-child(2) {
            animation-delay: .15s;
        }


        .loading span:nth-child(3) {
            animation-delay: .3s;
        }


        @keyframes bounce {

            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-6px);
            }
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .input-area {
            padding: 12px 15px 14px;

            background:
                rgba(2, 6, 23, 0.98);

            border-top:
                1px solid
                rgba(255,255,255,0.08);

            flex-shrink: 0;
        }


        .input-box {
            display: flex;

            align-items: flex-end;

            gap: 9px;

            background: #0f172a;

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 18px;

            padding: 7px;
        }


        textarea {
            flex: 1;

            resize: none;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            font-size: 15px;

            padding: 10px;

            min-height: 45px;

            max-height: 140px;

            font-family: inherit;

            line-height: 1.4;
        }


        textarea::placeholder {
            color: #64748b;
        }


        #sendButton {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            color: white;

            font-size: 19px;

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: pointer;
        }


        #sendButton:hover {
            opacity: .9;
        }


        #sendButton:disabled {
            opacity: .5;

            cursor: not-allowed;
        }


        .info {
            text-align: center;

            color: #64748b;

            font-size: 10px;

            margin-top: 7px;
        }


        /* =====================================================
           PANNEAU HISTORIQUE
        ===================================================== */

        .history-overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.65);

            z-index: 100;

            display: none;
        }


        .history-overlay.show {
            display: block;
        }


        .history-panel {
            position: absolute;

            top: 0;
            left: 0;

            width: min(360px, 88vw);

            height: 100%;

            background:
                #020617;

            border-right:
                1px solid
                rgba(255,255,255,0.1);

            box-shadow:
                10px 0 40px
                rgba(0,0,0,0.45);

            display: flex;

            flex-direction: column;

            animation:
                slideIn .22s ease;
        }


        @keyframes slideIn {

            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(0);
            }
        }


        .history-header {
            padding: 17px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .history-header h2 {
            font-size: 19px;
        }


        .close-history {
            width: 38px;
            height: 38px;

            border: none;

            border-radius: 10px;

            background: #111827;

            color: white;

            font-size: 20px;

            cursor: pointer;
        }


        .history-new {
            margin: 14px;

            padding: 12px;

            border: none;

            border-radius: 12px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;
        }


        .history-list {
            flex: 1;

            overflow-y: auto;

            padding: 0 10px 15px;
        }


        .history-empty {
            text-align: center;

            color: #64748b;

            padding: 35px 20px;

            line-height: 1.6;
        }


        .history-item {
            display: flex;

            align-items: center;

            gap: 8px;

            padding: 12px;

            margin-bottom: 7px;

            border-radius: 12px;

            cursor: pointer;

            background: #0f172a;

            border:
                1px solid
                rgba(255,255,255,0.04);
        }


        .history-item:hover {
            background: #1e293b;
        }


        .history-item.active {
            background: #172554;

            border-color:
                rgba(59,130,246,0.3);
        }


        .history-content {
            flex: 1;

            min-width: 0;
        }


        .history-title {
            font-size: 14px;

            color: white;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .history-date {
            font-size: 10px;

            color: #64748b;

            margin-top: 5px;
        }


        .delete-history {
            width: 34px;
            height: 34px;

            flex-shrink: 0;

            border: none;

            border-radius: 9px;

            background: transparent;

            color: #94a3b8;

            cursor: pointer;

            font-size: 16px;
        }


        .delete-history:hover {
            background: #3f172a;

            color: #f87171;
        }


        /* =====================================================
           TOAST
        ===================================================== */

        .toast {
            position: fixed;

            left: 50%;

            bottom: 95px;

            transform:
                translate(-50%, 20px);

            background: #1e293b;

            border:
                1px solid
                rgba(255,255,255,0.1);

            color: white;

            padding: 11px 16px;

            border-radius: 12px;

            font-size: 13px;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .2s,
                transform .2s;

            z-index: 300;

            max-width: 85%;

            text-align: center;
        }


        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .header {
                height: 68px;

                padding:
                    10px 12px;
            }


            .logo-icon {
                width: 40px;
                height: 40px;

                font-size: 19px;
            }


            .logo-text h1 {
                font-size: 17px;
            }


            .logo-text p {
                font-size: 10px;
            }


            .header-buttons {
                gap: 5px;
            }


            .header-button {
                width: 40px;
                height: 40px;

                padding: 0;

                font-size: 0;
            }


            .header-button span {
                font-size: 18px;
            }


            .chat {
                padding:
                    18px 12px 15px;
            }


            .welcome {
                padding:
                    45px 12px 30px;
            }


            .welcome h2 {
                font-size: 23px;
            }


            .welcome p {
                font-size: 14px;
            }


            .bubble {
                max-width: 91%;

                font-size: 15px;

                padding:
                    13px 14px;
            }


            .input-area {
                padding:
                    9px 10px 10px;
            }


            .info {
                font-size: 9px;
            }

        }


        /* =====================================================
           PETITS ÉCRANS
        ===================================================== */

        @media (max-height: 650px) {

            .welcome {
                padding-top: 25px;
            }


            .welcome-icon {
                width: 60px;
                height: 60px;

                font-size: 27px;

                margin-bottom: 12px;
            }


            .welcome h2 {
                font-size: 21px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                M
            </div>

            <div class="logo-text">

                <h1>
                    Messie IA
                </h1>

                <p>
                    Ton assistant intelligent
                </p>

            </div>

        </div>


        <div class="header-buttons">

            <!-- HISTORIQUE -->

            <button
                class="header-button"
                id="historyButton"
                type="button"
                title="Historique"
            >

                <span>📚</span>

                <span>
                    Historique
                </span>

            </button>


            <!-- NOUVELLE CONVERSATION -->

            <button
                class="header-button new"
                id="newConversationButton"
                type="button"
                title="Nouvelle conversation"
            >

                <span>＋</span>

                <span>
                    Nouveau
                </span>

            </button>

        </div>

    </header>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <main
        class="chat"
        id="chat"
    >

    </main>


    <!-- =====================================================
         INPUT
    ====================================================== -->

    <section class="input-area">

        <div class="input-box">

            <textarea
                id="messageInput"
                placeholder="Écris ton message..."
                rows="1"
                autocomplete="off"
            ></textarea>


            <button
                id="sendButton"
                type="button"
                title="Envoyer"
            >
                ➤
            </button>

        </div>


        <div class="info">
            Messie IA peut parfois faire des erreurs.
        </div>

    </section>


</div>


<!-- =========================================================
     PANNEAU HISTORIQUE
========================================================= -->

<div
    class="history-overlay"
    id="historyOverlay"
>

    <aside class="history-panel">


        <div class="history-header">

            <h2>
                📚 Historique
            </h2>


            <button
                class="close-history"
                id="closeHistory"
                type="button"
            >
                ×
            </button>

        </div>


        <button
            class="history-new"
            id="historyNewButton"
            type="button"
        >
            ＋ Nouvelle conversation
        </button>


        <div
            class="history-list"
            id="historyList"
        >

        </div>


    </aside>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

<div
    class="toast"
    id="toast"
>
</div>


<script>

    /* ========================================================
       CONFIGURATION
    ======================================================== */

    const STORAGE_KEY =
        "messie_ia_conversations_v1";


    /* ========================================================
       ÉLÉMENTS HTML
    ======================================================== */

    const chat =
        document.getElementById("chat");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const historyButton =
        document.getElementById("historyButton");

    const historyOverlay =
        document.getElementById("historyOverlay");

    const closeHistory =
        document.getElementById("closeHistory");

    const historyList =
        document.getElementById("historyList");

    const newConversationButton =
        document.getElementById(
            "newConversationButton"
        );

    const historyNewButton =
        document.getElementById(
            "historyNewButton"
        );

    const toast =
        document.getElementById("toast");


    /* ========================================================
       VARIABLES
    ======================================================== */

    let conversations = [];

    let currentConversationId = null;

    let isSending = false;


    /* ========================================================
       CHARGER LES CONVERSATIONS
    ======================================================== */

    function loadConversations() {

        try {

            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );


            if (!saved) {

                conversations = [];

                return;
            }


            const parsed =
                JSON.parse(saved);


            if (Array.isArray(parsed)) {

                conversations = parsed;

            } else {

                conversations = [];

            }

        } catch (error) {

            console.error(
                "Erreur chargement historique:",
                error
            );

            conversations = [];
        }
    }


    /* ========================================================
       SAUVEGARDER LES CONVERSATIONS
    ======================================================== */

    function saveConversations() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(
                    conversations
                )
            );

        } catch (error) {

            console.error(
                "Erreur sauvegarde historique:",
                error
            );

            showToast(
                "Impossible de sauvegarder l'historique."
            );
        }
    }


    /* ========================================================
       ID UNIQUE
    ======================================================== */

    function createId() {

        return (
            Date.now().toString(36)
            +
            Math.random()
                .toString(36)
                .substring(2, 9)
        );
    }


    /* ========================================================
       CRÉER UNE CONVERSATION
    ======================================================== */

    function createConversation() {

        const conversation = {

            id: createId(),

            title: "Nouvelle conversation",

            createdAt:
                new Date().toISOString(),

            updatedAt:
                new Date().toISOString(),

            messages: []

        };


        conversations.unshift(
            conversation
        );


        currentConversationId =
            conversation.id;


        saveConversations();

        renderChat();

        renderHistory();

        closeHistoryPanel();

        messageInput.focus();
    }


    /* ========================================================
       CONVERSATION ACTUELLE
    ======================================================== */

    function getCurrentConversation() {

        return conversations.find(
            conversation =>
                conversation.id ===
                currentConversationId
        );

    }


    /* ========================================================
       TITRE AUTOMATIQUE
    ======================================================== */

    function createTitle(text) {

        if (!text) {

            return "Nouvelle conversation";
        }


        let title =
            text
                .replace(/\s+/g, " ")
                .trim();


        if (title.length > 38) {

            title =
                title.substring(0, 38)
                + "...";
        }


        return title;
    }


    /* ========================================================
       FORMAT DATE
    ======================================================== */

    function formatDate(dateString) {

        try {

            const date =
                new Date(dateString);


            return date.toLocaleString(
                "fr-FR",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        } catch {

            return "";
        }
    }


    /* ========================================================
       AFFICHER L'HISTORIQUE
    ======================================================== */

    function renderHistory() {

        historyList.innerHTML = "";


        if (!conversations.length) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "history-empty";


            empty.innerHTML =
                `
                <div style="font-size:32px;margin-bottom:10px;">
                    📭
                </div>

                <div>
                    Aucune conversation enregistrée.
                </div>

                <div style="margin-top:7px;">
                    Commence une conversation pour
                    créer ton premier historique.
                </div>
                `;


            historyList.appendChild(
                empty
            );


            return;
        }


        conversations.forEach(
            conversation => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "history-item";


                if (
                    conversation.id ===
                    currentConversationId
                ) {

                    item.classList.add(
                        "active"
                    );
                }


                const content =
                    document.createElement(
                        "div"
                    );


                content.className =
                    "history-content";


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "history-title";


                title.textContent =
                    conversation.title ||
                    "Nouvelle conversation";


                const date =
                    document.createElement(
                        "div"
                    );


                date.className =
                    "history-date";


                date.textContent =
                    formatDate(
                        conversation.updatedAt ||
                        conversation.createdAt
                    );


                content.appendChild(title);

                content.appendChild(date);


                /* Ouvrir la conversation */

                content.addEventListener(
                    "click",
                    () => {

                        openConversation(
                            conversation.id
                        );

                    }
                );


                /* Supprimer */

                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete-history";


                deleteButton.type =
                    "button";


                deleteButton.title =
                    "Supprimer";


                deleteButton.textContent =
                    "🗑️";


                deleteButton.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        deleteConversation(
                            conversation.id
                        );

                    }
                );


                item.appendChild(content);

                item.appendChild(
                    deleteButton
                );


                historyList.appendChild(
                    item
                );

            }
        );
    }


    /* ========================================================
       OUVRIR UNE CONVERSATION
    ======================================================== */

    function openConversation(id) {

        const conversation =
            conversations.find(
                item =>
                    item.id === id
            );


        if (!conversation) {

            return;
        }


        currentConversationId =
            id;


        renderChat();

        renderHistory();

        closeHistoryPanel();

        setTimeout(
            () => {
                scrollChatToBottom();
            },
            50
        );
    }


    /* ========================================================
       SUPPRIMER UNE CONVERSATION
    ======================================================== */

    function deleteConversation(id) {

        const conversation =
            conversations.find(
                item =>
                    item.id === id
            );


        if (!conversation) {

            return;
        }


        const confirmed =
            confirm(
                "Supprimer cette conversation ?"
            );


        if (!confirmed) {

            return;
        }


        conversations =
            conversations.filter(
                item =>
                    item.id !== id
            );


        if (
            currentConversationId === id
        ) {

            if (conversations.length) {

                currentConversationId =
                    conversations[0].id;

            } else {

                currentConversationId =
                    null;
            }
        }


        saveConversations();

        renderHistory();

        renderChat();


        showToast(
            "Conversation supprimée."
        );
    }


    /* ========================================================
       NOUVELLE CONVERSATION
    ======================================================== */

    function startNewConversation() {

        createConversation();

        showToast(
            "Nouvelle conversation créée."
        );
    }


    /* ========================================================
       RENDRE LE CHAT
    ======================================================== */

    function renderChat() {

        chat.innerHTML = "";


        const conversation =
            getCurrentConversation();


        if (
            !conversation ||
            !conversation.messages ||
            !conversation.messages.length
        ) {

            renderWelcome();

            return;
        }


        conversation.messages.forEach(
            message => {

                if (
                    message.role !== "user" &&
                    message.role !== "assistant"
                ) {

                    return;
                }


                addMessageToScreen(
                    message.role,
                    message.content
                );

            }
        );


        scrollChatToBottom();
    }


    /* ========================================================
       MESSAGE D'ACCUEIL
    ======================================================== */

    function renderWelcome() {

        const welcome =
            document.createElement(
                "div"
            );


        welcome.className =
            "welcome";


        welcome.innerHTML =
            `
            <div class="welcome-icon">
                M
            </div>

            <h2>
                Bonjour 👋
            </h2>

            <p>
                Je suis Messie IA.
                Pose-moi une question, demande-moi
                de l'aide ou parle-moi simplement.
            </p>
            `;


        chat.appendChild(
            welcome
        );
    }


    /* ========================================================
       AJOUTER UN MESSAGE À L'ÉCRAN
    ======================================================== */

    function addMessageToScreen(
        role,
        content
    ) {

        const message =
            document.createElement(
                "div"
            );


        message.className =
            "message " +
            (
                role === "user"
                    ? "user"
                    : "ai"
            );


        const bubble =
            document.createElement(
                "div"
            );


        bubble.className =
            "bubble";


        /*
         * IMPORTANT :
         * textContent est utilisé ici et non innerHTML.
         * Cela évite qu'une réponse de l'IA puisse
         * injecter du HTML ou du JavaScript.
         */

        bubble.textContent =
            content;


        message.appendChild(
            bubble
        );


        chat.appendChild(
            message
        );


        return message;
    }


    /* ========================================================
       INDICATEUR DE CHARGEMENT
    ======================================================== */

    function addLoadingMessage() {

        const message =
            document.createElement(
                "div"
            );


        message.className =
            "message ai";


        message.id =
            "loadingMessage";


        const bubble =
            document.createElement(
                "div"
            );


        bubble.className =
            "bubble";


        bubble.innerHTML =
            `
            <div class="loading">
                <span></span>
                <span></span>
                <span></span>
            </div>
            `;


        message.appendChild(
            bubble
        );


        chat.appendChild(
            message
        );


        scrollChatToBottom();
    }


    /* ========================================================
       RETIRER LE CHARGEMENT
    ======================================================== */

    function removeLoadingMessage() {

        const loading =
            document.getElementById(
                "loadingMessage"
            );


        if (loading) {

            loading.remove();
        }
    }


    /* ========================================================
       SCROLL
    ======================================================== */

    function scrollChatToBottom() {

        setTimeout(
            () => {

                chat.scrollTop =
                    chat.scrollHeight;

            },
            50
        );
    }


    /* ========================================================
       ENVOYER UN MESSAGE
    ======================================================== */

    async function sendMessage() {

        if (isSending) {

            return;
        }


        const message =
            messageInput.value.trim();


        if (!message) {

            return;
        }


        /*
         * Si aucune conversation n'existe,
         * on en crée automatiquement une.
         */

        if (!currentConversationId) {

            createConversation();
        }


        let conversation =
            getCurrentConversation();


        if (!conversation) {

            createConversation();

            conversation =
                getCurrentConversation();
        }


        /*
         * Ajouter le message utilisateur
         */

        conversation.messages.push({

            role: "user",

            content: message,

            createdAt:
                new Date().toISOString()

        });


        /*
         * Premier message = titre
         */

        if (
            conversation.messages.length === 1
        ) {

            conversation.title =
                createTitle(message);
        }


        conversation.updatedAt =
            new Date().toISOString();


        saveConversations();

        renderHistory();


        /*
         * Afficher le message
         */

        renderChat();


        /*
         * Vider la zone de texte
         */

        messageInput.value = "";

        resizeTextarea();


        /*
         * Désactiver le bouton
         */

        isSending = true;

        sendButton.disabled = true;


        /*
         * Afficher chargement
         */

        addLoadingMessage();


        try {

            /*
             * Préparer l'historique pour Python.
             *
             * On envoie les messages déjà présents.
             */

            const history =
                conversation.messages
                    .map(item => ({
                        role: item.role,
                        content: item.content
                    }));


            /*
             * Appel à ton serveur Flask.
             */

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            message:
                                message,

                            history:
                                history.slice(
                                    0,
                                    -1
                                )

                        })
                    }
                );


            /*
             * Lire la réponse
             */

            let data;

            try {

                data =
                    await response.json();

            } catch {

                throw new Error(
                    "Le serveur a renvoyé une réponse invalide."
                );
            }


            /*
             * Vérifier erreur HTTP
             */

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Une erreur est survenue."
                );
            }


            /*
             * IMPORTANT :
             *
             * On récupère UNIQUEMENT data.response.
             *
             * Cela empêche d'afficher des informations
             * comme :
             *
             * User Safety: safe
             * Response Safety: safe
             *
             * dans la conversation.
             */

            let answer =
                data.response;


            /*
             * Vérification de sécurité supplémentaire.
             */

            if (
                typeof answer !== "string"
            ) {

                answer =
                    String(answer || "");
            }


            answer =
                cleanAIResponse(answer);


            if (!answer.trim()) {

                throw new Error(
                    "Messie IA n'a pas renvoyé de réponse."
                );
            }


            /*
             * Supprimer le chargement
             */

            removeLoadingMessage();


            /*
             * Sauvegarder la réponse IA
             */

            conversation.messages.push({

                role: "assistant",

                content: answer,

                createdAt:
                    new Date().toISOString()

            });


            conversation.updatedAt =
                new Date().toISOString();


            saveConversations();


            /*
             * Afficher
             */

            renderChat();

            renderHistory();

            scrollChatToBottom();


        } catch (error) {

            console.error(
                "Erreur:",
                error
            );


            removeLoadingMessage();


            /*
             * Message d'erreur visible
             */

            addMessageToScreen(
                "assistant",
                "Désolé, une erreur est survenue :\n" +
                error.message
            );

        } finally {

            isSending = false;

            sendButton.disabled = false;

            messageInput.focus();
        }
    }


    /* ========================================================
       NETTOYAGE RÉPONSE IA
    ======================================================== */

    function cleanAIResponse(text) {

        if (!text) {

            return "";
        }


        let result =
            String(text);


        /*
         * Supprimer des blocs de sécurité qui pourraient
         * accidentellement arriver dans la réponse.
         */

        result =
            result.replace(
                /User Safety\s*:\s*safe/gi,
                ""
            );


        result =
            result.replace(
                /Response Safety\s*:\s*safe/gi,
                ""
            );


        result =
            result.replace(
                /User Safety\s*:\s*unsafe/gi,
                ""
            );


        result =
            result.replace(
                /Response Safety\s*:\s*unsafe/gi,
                ""
            );


        /*
         * Nettoyer les espaces inutiles laissés
         * par la suppression.
         */

        result =
            result.replace(
                /\n\s*\n\s*\n+/g,
                "\n\n"
            );


        return result.trim();
    }


    /* ========================================================
       TEXTAREA AUTO-RESIZE
    ======================================================== */

    function resizeTextarea() {

        messageInput.style.height =
            "auto";


        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                140
            )
            + "px";
    }


    /* ========================================================
       OUVRIR HISTORIQUE
    ======================================================== */

    function openHistoryPanel() {

        renderHistory();

        historyOverlay.classList.add(
            "show"
        );
    }


    /* ========================================================
       FERMER HISTORIQUE
    ======================================================== */

    function closeHistoryPanel() {

        historyOverlay.classList.remove(
            "show"
        );
    }


    /* ========================================================
       TOAST
    ======================================================== */

    let toastTimer = null;


    function showToast(message) {

        toast.textContent =
            message;


        toast.classList.add(
            "show"
        );


        clearTimeout(
            toastTimer
        );


        toastTimer =
            setTimeout(
                () => {

                    toast.classList.remove(
                        "show"
                    );

                },
                2500
            );
    }


    /* ========================================================
       ÉVÉNEMENTS
    ======================================================== */


    /*
     * Envoyer
     */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /*
     * Entrée = envoyer
     *
     * Shift + Entrée = nouvelle ligne
     */

    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }

        }
    );


    /*
     * Agrandir textarea
     */

    messageInput.addEventListener(
        "input",
        resizeTextarea
    );


    /*
     * Ouvrir historique
     */

    historyButton.addEventListener(
        "click",
        openHistoryPanel
    );


    /*
     * Fermer historique
     */

    closeHistory.addEventListener(
        "click",
        closeHistoryPanel
    );


    /*
     * Cliquer en dehors du panneau
     */

    historyOverlay.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                historyOverlay
            ) {

                closeHistoryPanel();
            }

        }
    );


    /*
     * Nouvelle conversation
     */

    newConversationButton.addEventListener(
        "click",
        startNewConversation
    );


    /*
     * Nouvelle conversation depuis historique
     */

    historyNewButton.addEventListener(
        "click",
        startNewConversation
    );


    /* ========================================================
       INITIALISATION
    ======================================================== */

    function initialize() {

        loadConversations();


        /*
         * S'il existe déjà des conversations,
         * ouvrir la dernière.
         */

        if (conversations.length > 0) {

            currentConversationId =
                conversations[0].id;

        } else {

            /*
             * Première utilisation :
             * créer automatiquement une conversation.
             */

            createConversation();

            return;
        }


        renderChat();

        renderHistory();

        messageInput.focus();
    }


    /* ========================================================
       DÉMARRER
    ======================================================== */

    initialize();

</script>
