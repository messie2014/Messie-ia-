<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messie IA</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #020617
                );

            color: white;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 15px;
        }


        /* =====================================================
           APPLICATION
        ===================================================== */

        .app {

            width: 100%;

            max-width: 850px;

            height: 90vh;

            max-height: 850px;

            background:
                rgba(15, 23, 42, 0.96);

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 25px;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.5);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            flex-shrink: 0;

            padding: 18px 20px;

            background:
                rgba(2, 6, 23, 0.95);

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .logo {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .logo-icon {

            width: 45px;

            height: 45px;

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            font-size: 22px;

            font-weight: bold;
        }


        .logo-text h1 {

            font-size: 20px;

            color: white;
        }


        .logo-text p {

            font-size: 12px;

            color: #94a3b8;

            margin-top: 3px;
        }


        .header-actions {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .status {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #94a3b8;

            font-size: 12px;
        }


        .status-dot {

            width: 9px;

            height: 9px;

            background: #22c55e;

            border-radius: 50%;

            box-shadow:
                0 0 8px
                rgba(34,197,94,0.7);
        }


        #newChatButton {

            background: #1e293b;

            border:
                1px solid
                rgba(255,255,255,0.1);

            color: #cbd5e1;

            padding: 8px 11px;

            border-radius: 10px;

            font-size: 12px;

            cursor: pointer;
        }


        #newChatButton:hover {

            background: #334155;
        }


        /* =====================================================
           CHAT
        ===================================================== */

        .chat {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding: 25px 18px;

            scroll-behavior: smooth;
        }


        .chat::-webkit-scrollbar {

            width: 6px;
        }


        .chat::-webkit-scrollbar-thumb {

            background: #334155;

            border-radius: 10px;
        }


        /* =====================================================
           MESSAGE D'ACCUEIL
        ===================================================== */

        .welcome {

            text-align: center;

            padding: 40px 15px;
        }


        .welcome-icon {

            font-size: 55px;

            margin-bottom: 15px;
        }


        .welcome h2 {

            font-size: 28px;

            margin-bottom: 10px;
        }


        .welcome p {

            color: #94a3b8;

            line-height: 1.6;
        }


        /* =====================================================
           MESSAGES
        ===================================================== */

        .message {

            display: flex;

            width: 100%;

            margin-bottom: 20px;
        }


        .message.user {

            justify-content: flex-end;
        }


        .message.ai {

            justify-content: flex-start;
        }


        .bubble {

            max-width: 85%;

            padding: 13px 16px;

            border-radius: 18px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-wrap: break-word;

            overflow-wrap: break-word;

            font-size: 15px;
        }


        .user .bubble {

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            border-bottom-right-radius: 5px;
        }


        .ai .bubble {

            background: #1e293b;

            border:
                1px solid
                rgba(255,255,255,0.06);

            border-bottom-left-radius: 5px;
        }


        /* =====================================================
           CHARGEMENT
        ===================================================== */

        .loading {

            display: flex;

            gap: 5px;

            align-items: center;

            min-height: 20px;
        }


        .loading span {

            width: 7px;

            height: 7px;

            background: #94a3b8;

            border-radius: 50%;

            animation:
                bounce 1.2s infinite;
        }


        .loading span:nth-child(2) {

            animation-delay: .15s;
        }


        .loading span:nth-child(3) {

            animation-delay: .3s;
        }


        @keyframes bounce {

            0%,
            60%,
            100% {

                transform:
                    translateY(0);
            }

            30% {

                transform:
                    translateY(-6px);
            }
        }


        /* =====================================================
           ZONE DE SAISIE
        ===================================================== */

        .input-area {

            flex-shrink: 0;

            padding: 15px;

            background:
                rgba(2, 6, 23, 0.98);

            border-top:
                1px solid
                rgba(255,255,255,0.08);
        }


        .input-box {

            display: flex;

            align-items: flex-end;

            gap: 10px;

            width: 100%;

            background: #1e293b;

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 18px;

            padding: 8px;
        }


        textarea {

            flex: 1;

            width: 100%;

            resize: none;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            font-size: 15px;

            padding: 10px;

            min-height: 45px;

            max-height: 140px;

            font-family: inherit;

            line-height: 1.4;
        }


        textarea::placeholder {

            color: #64748b;
        }


        button {

            border: none;

            color: white;
        }


        #sendButton {

            width: 45px;

            height: 45px;

            min-width: 45px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            font-size: 20px;

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: pointer;
        }


        #sendButton:hover {

            opacity: .9;
        }


        #sendButton:disabled {

            opacity: .5;

            cursor: not-allowed;
        }


        .info {

            text-align: center;

            color: #64748b;

            font-size: 11px;

            margin-top: 8px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {

                padding: 0;

                align-items: stretch;
            }


            .app {

                width: 100%;

                height: 100vh;

                height: 100dvh;

                max-height: none;

                border-radius: 0;

                border: none;
            }


            .header {

                padding: 12px;
            }


            .logo-icon {

                width: 42px;

                height: 42px;
            }


            .logo-text h1 {

                font-size: 18px;
            }


            .logo-text p {

                font-size: 11px;
            }


            .header-actions {

                gap: 7px;
            }


            .status {

                display: none;
            }


            #newChatButton {

                font-size: 11px;

                padding: 7px 9px;
            }


            .chat {

                padding:
                    20px 12px;
            }


            .welcome {

                padding-top: 60px;
            }


            .welcome h2 {

                font-size: 24px;
            }


            .welcome-icon {

                font-size: 48px;
            }


            .bubble {

                max-width: 90%;

                font-size: 15px;
            }


            .input-area {

                padding:
                    10px;
            }


            textarea {

                font-size: 16px;
            }
        }

    </style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                M
            </div>


            <div class="logo-text">

                <h1>
                    Messie IA
                </h1>

                <p>
                    Ton assistant intelligent
                </p>

            </div>

        </div>


        <div class="header-actions">

            <div class="status">

                <span class="status-dot"></span>

                <span>
                    En ligne
                </span>

            </div>


            <button
                id="newChatButton"
                type="button"
            >
                Nouvelle conversation
            </button>

        </div>

    </header>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <main
        class="chat"
        id="chat"
    >

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-icon">
                🤖
            </div>

            <h2>
                Bonjour 👋
            </h2>

            <p>
                Je suis Messie IA.<br>
                Pose-moi une question et je vais essayer
                de t'aider.
            </p>

        </div>

    </main>


    <!-- =====================================================
         ZONE DE MESSAGE
    ====================================================== -->

    <div class="input-area">

        <div class="input-box">

            <textarea
                id="messageInput"
                placeholder="Écris ton message..."
                rows="1"
                autocomplete="off"
            ></textarea>


            <button
                id="sendButton"
                type="button"
                title="Envoyer"
                aria-label="Envoyer le message"
            >
                ➤
            </button>

        </div>


        <div class="info">

            Messie IA peut parfois faire des erreurs.

        </div>

    </div>


</div>



<script>

    /* =====================================================
       ÉLÉMENTS DE LA PAGE
    ===================================================== */

    const chat =
        document.getElementById("chat");


    const input =
        document.getElementById("messageInput");


    const sendButton =
        document.getElementById("sendButton");


    const newChatButton =
        document.getElementById("newChatButton");


    const welcome =
        document.getElementById("welcome");


    /* =====================================================
       STOCKAGE LOCAL
    ===================================================== */

    const STORAGE_KEY =
        "messie_ia_conversation_v1";


    /*
       Historique complet conservé sur le téléphone.
    */

    let conversationHistory = [];


    /*
       Historique envoyé au serveur.

       On limite à 20 messages pour éviter
       des requêtes trop importantes.
    */

    const MAX_HISTORY_FOR_AI = 20;


    /* =====================================================
       SAUVEGARDER L'HISTORIQUE
    ===================================================== */

    function saveConversation() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(
                    conversationHistory
                )
            );

        }

        catch (error) {

            console.error(
                "Erreur de sauvegarde :",
                error
            );

        }

    }


    /* =====================================================
       CHARGER L'HISTORIQUE
    ===================================================== */

    function loadConversation() {

        try {

            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );


            if (!saved) {

                return;

            }


            const history =
                JSON.parse(saved);


            if (
                !Array.isArray(history)
            ) {

                return;

            }


            conversationHistory =
                history;


            /*
               Afficher les messages sauvegardés.
            */

            conversationHistory.forEach(
                function(item) {

                    if (
                        !item ||
                        typeof item !== "object"
                    ) {

                        return;

                    }


                    if (
                        item.role === "user"
                    ) {

                        addMessage(
                            item.content,
                            "user"
                        );

                    }


                    else if (
                        item.role === "assistant"
                    ) {

                        addMessage(
                            item.content,
                            "ai"
                        );

                    }

                }
            );


            /*
               Supprimer l'accueil
               s'il y a une conversation.
            */

            if (
                conversationHistory.length > 0 &&
                welcome
            ) {

                welcome.remove();

            }

        }

        catch (error) {

            console.error(
                "Erreur de chargement :",
                error
            );

            conversationHistory = [];

        }

    }


    /* =====================================================
       AJOUTER UN MESSAGE À L'ÉCRAN
    ===================================================== */

    function addMessage(
        text,
        type
    ) {

        if (
            text === null ||
            text === undefined
        ) {

            return;

        }


        const message =
            document.createElement("div");


        message.className =
            "message " + type;


        const bubble =
            document.createElement("div");


        bubble.className =
            "bubble";


        bubble.textContent =
            String(text);


        message.appendChild(
            bubble
        );


        chat.appendChild(
            message
        );


        chat.scrollTop =
            chat.scrollHeight;

    }


    /* =====================================================
       CHARGEMENT
    ===================================================== */

    function addLoading() {

        const message =
            document.createElement("div");


        message.className =
            "message ai";


        message.id =
            "loadingMessage";


        const bubble =
            document.createElement("div");


        bubble.className =
            "bubble";


        const loading =
            document.createElement("div");


        loading.className =
            "loading";


        loading.innerHTML = `
            <span></span>
            <span></span>
            <span></span>
        `;


        bubble.appendChild(
            loading
        );


        message.appendChild(
            bubble
        );


        chat.appendChild(
            message
        );


        chat.scrollTop =
            chat.scrollHeight;

    }


    /* =====================================================
       SUPPRIMER CHARGEMENT
    ===================================================== */

    function removeLoading() {

        const loading =
            document.getElementById(
                "loadingMessage"
            );


        if (loading) {

            loading.remove();

        }

    }


    /* =====================================================
       ENVOYER MESSAGE
    ===================================================== */

    async function sendMessage() {

        const message =
            input.value.trim();


        if (!message) {

            return;

        }


        /*
           Supprimer l'accueil.
        */

        if (welcome) {

            welcome.remove();

        }


        /*
           Afficher le message.
        */

        addMessage(
            message,
            "user"
        );


        /*
           Ajouter à l'historique.
        */

        conversationHistory.push({

            role:
                "user",

            content:
                message

        });


        /*
           Sauvegarder immédiatement.
        */

        saveConversation();


        /*
           Nettoyer le champ.
        */

        input.value = "";

        input.style.height =
            "45px";


        /*
           Désactiver le bouton.
        */

        sendButton.disabled =
            true;


        /*
           Afficher chargement.
        */

        addLoading();


        try {


            /*
               Préparer les derniers messages
               pour l'IA.
            */

            const historyForAI =
                conversationHistory
                    .slice(
                        -MAX_HISTORY_FOR_AI
                    );


            /*
               Envoyer au serveur.
            */

            const response =
                await fetch(
                    "/api/chat",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                message:
                                    message,

                                history:
                                    historyForAI

                            })

                    }
                );


            /*
               Lire la réponse.
            */

            const data =
                await response.json();


            /*
               Supprimer chargement.
            */

            removeLoading();


            /*
               Vérifier erreur.
            */

            if (!response.ok) {

                /*
                   Retirer le message utilisateur
                   de l'historique s'il y a une erreur.
                */

                conversationHistory.pop();

                saveConversation();


                addMessage(

                    "❌ " +
                    (
                        data.error ||
                        "Une erreur est survenue."
                    ),

                    "ai"

                );


                return;

            }


            /*
               Récupérer la réponse.
            */

            const answer =
                data.response;


            if (!answer) {

                addMessage(

                    "❌ Messie IA n'a renvoyé aucune réponse.",

                    "ai"

                );

                return;

            }


            /*
               Afficher la réponse.
            */

            addMessage(

                answer,

                "ai"

            );


            /*
               Ajouter la réponse
               à l'historique.
            */

            conversationHistory.push({

                role:
                    "assistant",

                content:
                    answer

            });


            /*
               Sauvegarder.
            */

            saveConversation();

        }


        catch (error) {

            console.error(
                "Erreur réseau :",
                error
            );


            removeLoading();


            /*
               Retirer le message
               qui n'a pas été envoyé.
            */

            conversationHistory.pop();

            saveConversation();


            addMessage(

                "❌ Impossible de contacter Messie IA. Vérifie ta connexion ou le serveur.",

                "ai"

            );

        }


        finally {

            sendButton.disabled =
                false;

            input.focus();

        }

    }


    /* =====================================================
       NOUVELLE CONVERSATION
    ===================================================== */

    function newConversation() {

        const confirmation =
            confirm(
                "Voulez-vous vraiment commencer une nouvelle conversation ?"
            );


        if (!confirmation) {

            return;

        }


        /*
           Supprimer l'historique.
        */

        conversationHistory = [];


        localStorage.removeItem(
            STORAGE_KEY
        );


        /*
           Nettoyer les messages.
        */

        chat.innerHTML = `
            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-icon">
                    🤖
                </div>

                <h2>
                    Bonjour 👋
                </h2>

                <p>
                    Je suis Messie IA.<br>
                    Pose-moi une question et je vais essayer
                    de t'aider.
                </p>

            </div>
        `;


        /*
           Récupérer le nouvel élément welcome.
        */

        window.welcome =
            document.getElementById(
                "welcome"
            );


        input.value = "";

        input.style.height =
            "45px";

        input.focus();

    }


    /* =====================================================
       BOUTON NOUVELLE CONVERSATION
    ===================================================== */

    newChatButton.addEventListener(

        "click",

        newConversation

    );


    /* =====================================================
       BOUTON ENVOYER
    ===================================================== */

    sendButton.addEventListener(

        "click",

        sendMessage

    );


    /* =====================================================
       TOUCHE ENTRÉE
    ===================================================== */

    input.addEventListener(

        "keydown",

        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }

    );


    /* =====================================================
       AGRANDISSEMENT TEXTAREA
    ===================================================== */

    input.addEventListener(

        "input",

        function() {

            this.style.height =
                "45px";


            this.style.height =
                Math.min(
                    this.scrollHeight,
                    140
                ) + "px";

        }

    );


    /* =====================================================
       CHARGER L'HISTORIQUE AU DÉMARRAGE
    ===================================================== */

    loadConversation();


    /* =====================================================
       FOCUS
    ===================================================== */

    window.addEventListener(

        "load",

        function() {

            input.focus();

        }

    );

</script>


</body>

</html>
