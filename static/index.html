<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messie IA</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #020617;
            --panel: #0f172a;
            --panel2: #111827;
            --border: rgba(255,255,255,0.09);
            --text: #ffffff;
            --muted: #94a3b8;
            --blue: #2563eb;
            --purple: #7c3aed;
            --danger: #ef4444;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #020617
                );

            color: var(--text);

            min-height: 100vh;

            overflow: hidden;
        }


        /* =====================================================
           APPLICATION
        ===================================================== */

        .app {
            width: 100%;
            height: 100vh;

            display: flex;

            background: var(--panel);
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            width: 280px;

            background:
                rgba(2, 6, 23, 0.98);

            border-right:
                1px solid var(--border);

            display: flex;

            flex-direction: column;

            flex-shrink: 0;

            z-index: 20;
        }


        .sidebar-header {
            padding: 18px;

            border-bottom:
                1px solid var(--border);
        }


        .brand {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 18px;
        }


        .brand-icon {
            width: 42px;
            height: 42px;

            border-radius: 13px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--blue)
                );

            font-size: 20px;

            font-weight: bold;
        }


        .brand-text h1 {
            font-size: 18px;
        }


        .brand-text p {
            color: var(--muted);

            font-size: 11px;

            margin-top: 3px;
        }


        /* NOUVELLE CONVERSATION */

        #newChatButton {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }


        #newChatButton:hover {
            opacity: .9;
        }


        /* TITRE HISTORIQUE */

        .history-title {
            padding: 16px 18px 8px;

            color: var(--muted);

            font-size: 12px;

            font-weight: bold;

            text-transform: uppercase;
        }


        /* HISTORIQUE */

        .history {
            flex: 1;

            overflow-y: auto;

            padding: 5px 10px 15px;
        }


        .history-empty {
            padding: 20px 10px;

            text-align: center;

            color: #64748b;

            font-size: 13px;

            line-height: 1.5;
        }


        .conversation {
            display: flex;

            align-items: center;

            gap: 8px;

            padding: 11px 10px;

            margin-bottom: 5px;

            border-radius: 10px;

            cursor: pointer;

            transition: background .2s;
        }


        .conversation:hover {
            background: rgba(255,255,255,0.06);
        }


        .conversation.active {
            background: rgba(37,99,235,0.18);
        }


        .conversation-main {
            flex: 1;

            min-width: 0;
        }


        .conversation-title {
            color: #e2e8f0;

            font-size: 13px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .conversation-date {
            color: #64748b;

            font-size: 10px;

            margin-top: 4px;
        }


        .conversation-actions {
            display: flex;

            gap: 3px;

            opacity: 0;
        }


        .conversation:hover .conversation-actions {
            opacity: 1;
        }


        .history-button {
            width: 28px;
            height: 28px;

            border: none;

            border-radius: 7px;

            background: transparent;

            color: #94a3b8;

            cursor: pointer;
        }


        .history-button:hover {
            background: rgba(255,255,255,0.08);

            color: white;
        }


        .history-button.delete:hover {
            color: #ef4444;
        }


        /* =====================================================
           SIDEBAR FOOTER
        ===================================================== */

        .sidebar-footer {
            padding: 13px 18px;

            border-top:
                1px solid var(--border);

            color: #64748b;

            text-align: center;

            font-size: 10px;
        }


        /* =====================================================
           ZONE PRINCIPALE
        ===================================================== */

        .main {
            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

            height: 100vh;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            height: 72px;

            padding: 12px 20px;

            background:
                rgba(2, 6, 23, 0.95);

            border-bottom:
                1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            flex-shrink: 0;
        }


        .header-left {
            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;
        }


        .mobile-menu {
            display: none;

            width: 40px;
            height: 40px;

            border: none;

            border-radius: 10px;

            background: #1e293b;

            color: white;

            font-size: 20px;

            cursor: pointer;
        }


        .current-chat {
            min-width: 0;
        }


        .current-chat h2 {
            font-size: 17px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .current-chat p {
            color: #22c55e;

            font-size: 11px;

            margin-top: 3px;
        }


        .online-dot {
            display: inline-block;

            width: 7px;
            height: 7px;

            background: #22c55e;

            border-radius: 50%;

            margin-right: 4px;
        }


        /* =====================================================
           CHAT
        ===================================================== */

        .chat {
            flex: 1;

            overflow-y: auto;

            padding: 25px 18px;

            scroll-behavior: smooth;
        }


        .welcome {
            text-align: center;

            max-width: 650px;

            margin: 0 auto;

            padding: 60px 15px;
        }


        .welcome-icon {
            font-size: 55px;

            margin-bottom: 15px;
        }


        .welcome h2 {
            font-size: 28px;

            margin-bottom: 10px;
        }


        .welcome p {
            color: var(--muted);

            line-height: 1.7;

            font-size: 14px;
        }


        .suggestions {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 8px;

            margin-top: 25px;
        }


        .suggestion {
            padding: 9px 13px;

            border: 1px solid var(--border);

            border-radius: 20px;

            background: rgba(255,255,255,0.03);

            color: #cbd5e1;

            cursor: pointer;

            font-size: 12px;
        }


        .suggestion:hover {
            background: rgba(255,255,255,0.08);
        }


        /* =====================================================
           MESSAGES
        ===================================================== */

        .message {
            display: flex;

            margin-bottom: 20px;
        }


        .message.user {
            justify-content: flex-end;
        }


        .message.ai {
            justify-content: flex-start;
        }


        .bubble {
            max-width: 85%;

            padding: 13px 16px;

            border-radius: 18px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-wrap: break-word;

            font-size: 14px;
        }


        .user .bubble {
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            border-bottom-right-radius: 5px;
        }


        .ai .bubble {
            background: #1e293b;

            border:
                1px solid
                rgba(255,255,255,0.06);

            border-bottom-left-radius: 5px;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            display: flex;

            gap: 5px;

            align-items: center;
        }


        .loading span {
            width: 7px;
            height: 7px;

            background: #94a3b8;

            border-radius: 50%;

            animation: bounce 1.2s infinite;
        }


        .loading span:nth-child(2) {
            animation-delay: .15s;
        }


        .loading span:nth-child(3) {
            animation-delay: .3s;
        }


        @keyframes bounce {

            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-6px);
            }
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .input-area {
            padding: 15px;

            background:
                rgba(2, 6, 23, 0.98);

            border-top:
                1px solid var(--border);

            flex-shrink: 0;
        }


        .input-box {
            display: flex;

            align-items: flex-end;

            gap: 10px;

            background: #1e293b;

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 18px;

            padding: 8px;
        }


        textarea {
            flex: 1;

            resize: none;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            font-size: 15px;

            padding: 10px;

            min-height: 45px;

            max-height: 140px;

            font-family: inherit;
        }


        textarea::placeholder {
            color: #64748b;
        }


        button {
            border: none;

            cursor: pointer;

            color: white;
        }


        #sendButton {
            width: 45px;
            height: 45px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            font-size: 18px;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        #sendButton:hover {
            opacity: .9;
        }


        #sendButton:disabled {
            opacity: .5;

            cursor: not-allowed;
        }


        .info {
            text-align: center;

            color: #64748b;

            font-size: 10px;

            margin-top: 8px;
        }


        /* =====================================================
           OVERLAY MOBILE
        ===================================================== */

        .overlay {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.6);

            z-index: 10;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .sidebar {
                position: fixed;

                left: -290px;

                top: 0;

                bottom: 0;

                transition: left .25s ease;

                box-shadow:
                    10px 0 40px rgba(0,0,0,.4);
            }


            .sidebar.open {
                left: 0;
            }


            .overlay.open {
                display: block;
            }


            .mobile-menu {
                display: block;
            }


            .header {
                height: 64px;

                padding: 10px 12px;
            }


            .chat {
                padding: 18px 12px;
            }


            .welcome {
                padding-top: 50px;
            }


            .welcome h2 {
                font-size: 24px;
            }


            .bubble {
                max-width: 90%;

                font-size: 14px;
            }


            .input-area {
                padding: 10px;
            }


            .conversation-actions {
                opacity: 1;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-header">

            <div class="brand">

                <div class="brand-icon">
                    M
                </div>

                <div class="brand-text">

                    <h1>
                        Messie IA
                    </h1>

                    <p>
                        Ton assistant intelligent
                    </p>

                </div>

            </div>


            <button
                id="newChatButton"
            >
                ＋ Nouvelle conversation
            </button>

        </div>


        <div class="history-title">
            Historique
        </div>


        <div
            class="history"
            id="history"
        >

        </div>


        <div class="sidebar-footer">
            Messie IA
        </div>

    </aside>


    <!-- =====================================================
         OVERLAY MOBILE
    ====================================================== -->

    <div
        class="overlay"
        id="overlay"
    ></div>


    <!-- =====================================================
         ZONE PRINCIPALE
    ====================================================== -->

    <main class="main">


        <!-- HEADER -->

        <header class="header">


            <div class="header-left">


                <button
                    class="mobile-menu"
                    id="mobileMenu"
                    aria-label="Menu"
                >
                    ☰
                </button>


                <div class="current-chat">

                    <h2 id="currentChatTitle">
                        Nouvelle conversation
                    </h2>

                    <p>
                        <span class="online-dot"></span>
                        En ligne
                    </p>

                </div>

            </div>


        </header>


        <!-- =================================================
             CHAT
        ================================================== -->

        <section
            class="chat"
            id="chat"
        >

        </section>


        <!-- =================================================
             INPUT
        ================================================== -->

        <div class="input-area">

            <div class="input-box">


                <textarea
                    id="messageInput"
                    placeholder="Écris ton message..."
                    rows="1"
                ></textarea>


                <button
                    id="sendButton"
                    title="Envoyer"
                >
                    ➤
                </button>


            </div>


            <div class="info">
                Messie IA peut parfois faire des erreurs.
            </div>

        </div>


    </main>

</div>


<script>

    /* =====================================================
       VARIABLES
    ===================================================== */

    const chat =
        document.getElementById("chat");

    const input =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const historyElement =
        document.getElementById("history");

    const newChatButton =
        document.getElementById("newChatButton");

    const currentChatTitle =
        document.getElementById("currentChatTitle");

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");

    const mobileMenu =
        document.getElementById("mobileMenu");


    /* =====================================================
       DONNÉES
    ===================================================== */

    let conversations = [];

    let currentConversationId = null;

    let isSending = false;


    /* =====================================================
       STOCKAGE
    ===================================================== */

    function saveConversations() {

        localStorage.setItem(
            "messieIA_conversations",
            JSON.stringify(conversations)
        );

    }


    function loadConversations() {

        try {

            const saved =
                localStorage.getItem(
                    "messieIA_conversations"
                );

            if (saved) {

                conversations =
                    JSON.parse(saved);

            }

        } catch (error) {

            console.error(
                "Erreur historique :",
                error
            );

            conversations = [];

        }

    }


    /* =====================================================
       ID UNIQUE
    ===================================================== */

    function createId() {

        return (
            Date.now().toString() +
            Math.random()
                .toString(36)
                .substring(2, 9)
        );

    }


    /* =====================================================
       DATE
    ===================================================== */

    function formatDate(timestamp) {

        const date =
            new Date(timestamp);

        return date.toLocaleDateString(
            "fr-FR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );

    }


    /* =====================================================
       CRÉER UNE CONVERSATION
    ===================================================== */

    function createConversation() {

        const conversation = {

            id: createId(),

            title:
                "Nouvelle conversation",

            createdAt:
                Date.now(),

            updatedAt:
                Date.now(),

            messages: []

        };


        conversations.unshift(
            conversation
        );


        currentConversationId =
            conversation.id;


        saveConversations();

        renderHistory();

        renderConversation();

        closeMobileMenu();

        input.focus();

    }


    /* =====================================================
       CONVERSATION ACTUELLE
    ===================================================== */

    function getCurrentConversation() {

        return conversations.find(
            conversation =>
                conversation.id ===
                currentConversationId
        );

    }


    /* =====================================================
       TITRE AUTOMATIQUE
    ===================================================== */

    function generateTitle(text) {

        let title =
            text.trim();

        if (!title) {

            return "Nouvelle conversation";

        }


        if (title.length > 35) {

            title =
                title.substring(0, 35) +
                "...";

        }


        return title;

    }


    /* =====================================================
       AJOUTER MESSAGE
    ===================================================== */

    function addMessageToConversation(
        role,
        content
    ) {

        const conversation =
            getCurrentConversation();


        if (!conversation) {

            return;

        }


        conversation.messages.push({

            role: role,

            content: content,

            timestamp: Date.now()

        });


        conversation.updatedAt =
            Date.now();


        if (
            role === "user" &&
            conversation.messages.length === 1
        ) {

            conversation.title =
                generateTitle(content);

        }


        saveConversations();

        renderHistory();

    }


    /* =====================================================
       AFFICHER MESSAGE
    ===================================================== */

    function displayMessage(
        text,
        type
    ) {

        const message =
            document.createElement("div");

        message.className =
            "message " + type;


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        bubble.textContent =
            text;


        message.appendChild(
            bubble
        );


        chat.appendChild(
            message
        );


        chat.scrollTop =
            chat.scrollHeight;

    }


    /* =====================================================
       MESSAGE D'ACCUEIL
    ===================================================== */

    function showWelcome() {

        chat.innerHTML = `

            <div class="welcome">

                <div class="welcome-icon">
                    🤖
                </div>

                <h2>
                    Bonjour 👋
                </h2>

                <p>
                    Je suis Messie IA.<br>
                    Pose-moi une question et je vais essayer de t'aider.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        data-text="Explique-moi quelque chose d'intéressant."
                    >
                        💡 Explique-moi quelque chose
                    </button>

                    <button
                        class="suggestion"
                        data-text="Aide-moi à créer une application."
                    >
                        💻 Aide-moi à créer une application
                    </button>

                    <button
                        class="suggestion"
                        data-text="Donne-moi une idée de projet."
                    >
                        🚀 Donne-moi une idée de projet
                    </button>

                </div>

            </div>

        `;


        document
            .querySelectorAll(".suggestion")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        input.value =
                            button.dataset.text;

                        input.focus();

                        autoResize();

                    }
                );

            });

    }


    /* =====================================================
       AFFICHER CONVERSATION
    ===================================================== */

    function renderConversation() {

        const conversation =
            getCurrentConversation();


        if (!conversation) {

            currentChatTitle.textContent =
                "Nouvelle conversation";

            showWelcome();

            return;

        }


        currentChatTitle.textContent =
            conversation.title;


        chat.innerHTML = "";


        if (
            conversation.messages.length === 0
        ) {

            showWelcome();

            return;

        }


        conversation.messages.forEach(
            message => {

                displayMessage(
                    message.content,
                    message.role === "user"
                        ? "user"
                        : "ai"
                );

            }
        );


        chat.scrollTop =
            chat.scrollHeight;

    }


    /* =====================================================
       HISTORIQUE
    ===================================================== */

    function renderHistory() {

        historyElement.innerHTML = "";


        if (
            conversations.length === 0
        ) {

            historyElement.innerHTML = `

                <div class="history-empty">

                    Aucune conversation.<br>
                    Commence une nouvelle discussion.

                </div>

            `;

            return;

        }


        conversations
            .sort(
                (a, b) =>
                    b.updatedAt -
                    a.updatedAt
            )
            .forEach(
                conversation => {

                    const item =
                        document.createElement("div");


                    item.className =
                        "conversation";


                    if (
                        conversation.id ===
                        currentConversationId
                    ) {

                        item.classList.add(
                            "active"
                        );

                    }


                    const main =
                        document.createElement("div");

                    main.className =
                        "conversation-main";


                    const title =
                        document.createElement("div");

                    title.className =
                        "conversation-title";

                    title.textContent =
                        conversation.title;


                    const date =
                        document.createElement("div");

                    date.className =
                        "conversation-date";

                    date.textContent =
                        formatDate(
                            conversation.updatedAt
                        );


                    main.appendChild(title);

                    main.appendChild(date);


                    const actions =
                        document.createElement("div");

                    actions.className =
                        "conversation-actions";


                    /* RENOMMER */

                    const renameButton =
                        document.createElement("button");

                    renameButton.className =
                        "history-button";

                    renameButton.title =
                        "Renommer";

                    renameButton.textContent =
                        "✏️";


                    renameButton.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();

                            renameConversation(
                                conversation.id
                            );

                        }
                    );


                    /* SUPPRIMER */

                    const deleteButton =
                        document.createElement("button");

                    deleteButton.className =
                        "history-button delete";

                    deleteButton.title =
                        "Supprimer";

                    deleteButton.textContent =
                        "🗑️";


                    deleteButton.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();

                            deleteConversation(
                                conversation.id
                            );

                        }
                    );


                    actions.appendChild(
                        renameButton
                    );

                    actions.appendChild(
                        deleteButton
                    );


                    item.appendChild(main);

                    item.appendChild(actions);


                    item.addEventListener(
                        "click",
                        () => {

                            openConversation(
                                conversation.id
                            );

                        }
                    );


                    historyElement.appendChild(
                        item
                    );

                }
            );

    }


    /* =====================================================
       OUVRIR CONVERSATION
    ===================================================== */

    function openConversation(id) {

        currentConversationId =
            id;


        saveConversations();

        renderHistory();

        renderConversation();

        closeMobileMenu();

        input.focus();

    }


    /* =====================================================
       RENOMMER
    ===================================================== */

    function renameConversation(id) {

        const conversation =
            conversations.find(
                item =>
                    item.id === id
            );


        if (!conversation) {

            return;

        }


        const newTitle =
            prompt(
                "Nouveau nom de la conversation :",
                conversation.title
            );


        if (
            newTitle === null
        ) {

            return;

        }


        const title =
            newTitle.trim();


        if (!title) {

            return;

        }


        conversation.title =
            title.substring(0, 60);


        conversation.updatedAt =
            Date.now();


        saveConversations();

        renderHistory();

        renderConversation();

    }


    /* =====================================================
       SUPPRIMER
    ===================================================== */

    function deleteConversation(id) {

        const conversation =
            conversations.find(
                item =>
                    item.id === id
            );


        if (!conversation) {

            return;

        }


        const confirmed =
            confirm(
                "Supprimer cette conversation ?"
            );


        if (!confirmed) {

            return;

        }


        conversations =
            conversations.filter(
                item =>
                    item.id !== id
            );


        if (
            currentConversationId === id
        ) {

            if (
                conversations.length > 0
            ) {

                currentConversationId =
                    conversations[0].id;

            } else {

                currentConversationId =
                    null;

            }

        }


        saveConversations();

        renderHistory();

        renderConversation();

    }


    /* =====================================================
       LOADING
    ===================================================== */

    function addLoading() {

        const message =
            document.createElement("div");

        message.className =
            "message ai";

        message.id =
            "loadingMessage";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        const loading =
            document.createElement("div");

        loading.className =
            "loading";


        loading.innerHTML = `

            <span></span>
            <span></span>
            <span></span>

        `;


        bubble.appendChild(
            loading
        );


        message.appendChild(
            bubble
        );


        chat.appendChild(
            message
        );


        chat.scrollTop =
            chat.scrollHeight;

    }


    /* =====================================================
       SUPPRIMER LOADING
    ===================================================== */

    function removeLoading() {

        const loading =
            document.getElementById(
                "loadingMessage"
            );


        if (loading) {

            loading.remove();

        }

    }


    /* =====================================================
       NETTOYER LES RÉPONSES INDÉSIRABLES
    ===================================================== */

    function cleanAIResponse(text) {

        if (
            typeof text !== "string"
        ) {

            return "";

        }


        /*
         * Certaines réponses de fournisseurs
         * peuvent contenir accidentellement
         * des informations techniques de sécurité.
         *
         * On retire uniquement les lignes
         * correspondant clairement à ces métadonnées.
         */

        const lines =
            text.split("\n");


        const filtered =
            lines.filter(line => {

                const lower =
                    line.toLowerCase().trim();


                if (
                    lower ===
                    "user safety: safe"
                ) {

                    return false;

                }


                if (
                    lower ===
                    "response safety: safe"
                ) {

                    return false;

                }


                if (
                    lower.startsWith(
                        "user safety:"
                    )
                ) {

                    return false;

                }


                if (
                    lower.startsWith(
                        "response safety:"
                    )
                ) {

                    return false;

                }


                return true;

            });


        return filtered
            .join("\n")
            .trim();

    }


    /* =====================================================
       ENVOYER MESSAGE
    ===================================================== */

    async function sendMessage() {

        if (isSending) {

            return;

        }


        const message =
            input.value.trim();


        if (!message) {

            return;

        }


        /* Si aucune conversation n'existe */

        if (
            !currentConversationId
        ) {

            createConversation();

        }


        const conversation =
            getCurrentConversation();


        if (!conversation) {

            return;

        }


        isSending = true;

        sendButton.disabled = true;


        /* Afficher utilisateur */

        displayMessage(
            message,
            "user"
        );


        /* Sauvegarder utilisateur */

        addMessageToConversation(
            "user",
            message
        );


        input.value = "";

        input.style.height =
            "45px";


        addLoading();


        try {

            /*
             * Construire l'historique
             * pour app.py
             */

            const history =
                conversation.messages
                    .slice(0, -1)
                    .map(message => ({

                        role:
                            message.role,

                        content:
                            message.content

                    }));


            const response =
                await fetch(
                    "/api/chat",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                message:
                                    message,

                                history:
                                    history

                            })

                    }
                );


            /*
             * Vérifier que le serveur
             * a bien renvoyé du JSON.
             */

            let data;


            try {

                data =
                    await response.json();

            } catch (jsonError) {

                throw new Error(
                    "Réponse invalide du serveur."
                );

            }


            removeLoading();


            if (!response.ok) {

                const errorMessage =
                    data.error ||
                    "Une erreur est survenue.";


                displayMessage(
                    "❌ " + errorMessage,
                    "ai"
                );


                return;

            }


            /*
             * IMPORTANT :
             *
             * app.py renvoie :
             *
             * {
             *     "response": answer
             * }
             *
             * donc on utilise data.response
             */

            let answer =
                cleanAIResponse(
                    data.response
                );


            if (!answer) {

                answer =
                    "Je n'ai pas reçu de réponse.";

            }


            displayMessage(
                answer,
                "ai"
            );


            addMessageToConversation(
                "assistant",
                answer
            );


            currentChatTitle.textContent =
                conversation.title;


        } catch (error) {

            removeLoading();


            console.error(
                "Erreur :",
                error
            );


            displayMessage(
                "❌ Impossible de contacter Messie IA. Vérifie ta connexion ou le serveur.",
                "ai"
            );

        } finally {

            isSending = false;

            sendButton.disabled =
                false;

            input.focus();

        }

    }


    /* =====================================================
       TEXTAREA
    ===================================================== */

    function autoResize() {

        input.style.height =
            "45px";


        input.style.height =
            Math.min(
                input.scrollHeight,
                140
            ) + "px";

    }


    input.addEventListener(
        "input",
        autoResize
    );


    /* =====================================================
       BOUTON ENVOYER
    ===================================================== */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /* =====================================================
       CLAVIER
    ===================================================== */

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =====================================================
       NOUVELLE CONVERSATION
    ===================================================== */

    newChatButton.addEventListener(
        "click",
        createConversation
    );


    /* =====================================================
       MENU MOBILE
    ===================================================== */

    function openMobileMenu() {

        sidebar.classList.add(
            "open"
        );

        overlay.classList.add(
            "open"
        );

    }


    function closeMobileMenu() {

        sidebar.classList.remove(
            "open"
        );

        overlay.classList.remove(
            "open"
        );

    }


    mobileMenu.addEventListener(
        "click",
        openMobileMenu
    );


    overlay.addEventListener(
        "click",
        closeMobileMenu
    );


    /* =====================================================
       INITIALISATION
    ===================================================== */

    function initialize() {

        loadConversations();


        if (
            conversations.length > 0
        ) {

            conversations.sort(
                (a, b) =>
                    b.updatedAt -
                    a.updatedAt
            );


            currentConversationId =
                conversations[0].id;


            renderHistory();

            renderConversation();

        } else {

            renderHistory();

            showWelcome();

        }


        input.focus();

    }


    initialize();

</script>
