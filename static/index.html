<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta

    <title>Messie IA</title>

            margin: 0;
            padding: 0;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #020617
                );

            color: white;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 15px;
        }

        .app {
            width: 100%;
            max-width: 850px;

            height: 90vh;
            max-height: 850px;

            background: rgba(15, 23, 42, 0.96);

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 25px;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            box-shadow:

        }

        /* =========================
           HEADER

        .header {
            padding: 18px 20px;

            background:

            border-bottom:
                1px solid rgba(255,255,255,0.08);

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            font-size: 22px;

            font-weight: bold;
        }

        .logo-text h1 {
            font-size: 20px;
        }

        .logo-text p {
            font-size: 12px;

            color: #94a3b8;

            margin-top: 3px;
        }

        .status {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #94a3b8;

            font-size: 12px;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            background: #22c55e;

            border-radius: 50%;
        }

        /* =========================
           CHAT
        ========================= */

        .chat {
            flex: 1;

            overflow-y: auto;

            padding: 25px 18px;

            scroll-behavior: smooth;
        }

            text-align: center;

            padding: 40px 15px;
        }

            font-size: 55px;

            margin-bottom: 15px;
        }

        .welcome h2 {
            font-size: 28px;

            margin-bottom: 10px;
        }

        .welcome p {
            color: #94a3b8;

            line-height: 1.6;
        }
