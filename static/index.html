<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messie IA</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #020617
                );

            color: white;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 15px;
        }

        .app {
            width: 100%;
            max-width: 850px;

            height: 90vh;
            max-height: 850px;

            background: rgba(15, 23, 42, 0.96);

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 25px;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            box-shadow:
                0 25px 80px rgba(0,0,0,0.5);
        }

        /* HEADER */

        .header {
            padding: 18px 20px;

            background:
                rgba(2, 6, 23, 0.95);

            border-bottom:
                1px solid rgba(255,255,255,0.08);

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            font-size: 22px;

            font-weight: bold;
        }

        .logo-text h1 {
            font-size: 20px;
        }

        .logo-text p {
            font-size: 12px;

            color: #94a3b8;

            margin-top: 3px;
        }

        .status {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #94a3b8;

            font-size: 12px;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            background: #22c55e;

            border-radius: 50%;
        }

        /* CHAT */

        .chat {
            flex: 1;

            overflow-y: auto;

            padding: 25px 18px;

            scroll-behavior: smooth;
        }

        .welcome {
            text-align: center;

            padding: 40px 15px;
        }

        .welcome-icon {
            font-size: 55px;

            margin-bottom: 15px;
        }

        .welcome h2 {
            font-size: 28px;

            margin-bottom: 10px;
        }

        .welcome p {
            color: #94a3b8;

            line-height: 1.6;
        }

        .message {
            display: flex;

            margin-bottom: 20px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 85%;

            padding: 13px 16px;

            border-radius: 18px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .user .bubble {
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            border-bottom-right-radius: 5px;
        }

        .ai .bubble {
            background: #1e293b;

            border:
                1px solid
                rgba(255,255,255,0.06);

            border-bottom-left-radius: 5px;
        }

        /* LOADING */

        .loading {
            display: flex;

            gap: 5px;

            align-items: center;
        }

        .loading span {
            width: 7px;
            height: 7px;

            background: #94a3b8;

            border-radius: 50%;

            animation: bounce 1.2s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: .15s;
        }

        .loading span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes bounce {

            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-6px);
            }
        }

        /* INPUT */

        .input-area {
            padding: 15px;

            background:
                rgba(2, 6, 23, 0.98);

            border-top:
                1px solid
                rgba(255,255,255,0.08);
        }

        .input-box {
            display: flex;

            align-items: flex-end;

            gap: 10px;

            background: #1e293b;

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 18px;

            padding: 8px;
        }

        textarea {
            flex: 1;

            resize: none;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            font-size: 15px;

            padding: 10px;

            min-height: 45px;

            max-height: 140px;

            font-family: inherit;
        }

        textarea::placeholder {
            color: #64748b;
        }

        button {
            border: none;

            cursor: pointer;

            color: white;
        }

        #sendButton {
            width: 45px;
            height: 45px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            font-size: 18px;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        #sendButton:hover {
            opacity: .9;
        }

        #sendButton:disabled {
            opacity: .5;

            cursor: not-allowed;
        }

        .info {
            text-align: center;

            color: #64748b;

            font-size: 11px;

            margin-top: 8px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 0;
            }

            .app {
                height: 100vh;

                max-height: none;

                border-radius: 0;
            }

            .header {
                padding: 14px;
            }

            .welcome {
                padding-top: 70px;
            }

            .welcome h2 {
                font-size: 24px;
            }

            .bubble {
                max-width: 90%;
            }

            .logo-text h1 {
                font-size: 18px;
            }

        }

    </style>

</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                M
            </div>

            <div class="logo-text">

                <h1>
                    Messie IA
                </h1>

                <p>
                    Ton assistant intelligent
                </p>

            </div>

        </div>

        <div class="status">

            <span class="status-dot"></span>

            En ligne

        </div>

    </header>


    <!-- CHAT -->

    <main
        class="chat"
        id="chat"
    >

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-icon">
                🤖
            </div>

            <h2>
                Bonjour 👋
            </h2>

            <p>
                Je suis Messie IA.<br>
                Pose-moi une question et je vais essayer
                de t'aider.
            </p>

        </div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">

            <textarea
                id="messageInput"
                placeholder="Écris ton message..."
                rows="1"
            ></textarea>

            <button
                id="sendButton"
                title="Envoyer"
                type="button"
            >
                ➤
            </button>

        </div>

        <div class="info">
            Messie IA peut parfois faire des erreurs.
        </div>

    </div>

</div>


<script>

    // =====================================================
    // ÉLÉMENTS
    // =====================================================

    const chat =
        document.getElementById("chat");

    const input =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const welcome =
        document.getElementById("welcome");


    // =====================================================
    // MÉMOIRE DE LA CONVERSATION
    // =====================================================

    let conversationHistory = [];


    // =====================================================
    // AJOUTER UN MESSAGE À L'ÉCRAN
    // =====================================================

    function addMessage(text, type) {

        const message =
            document.createElement("div");

        message.className =
            "message " + type;


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        if (
            text === null ||
            text === undefined ||
            text === ""
        ) {

            text =
                "Désolé, je n'ai reçu aucune réponse.";

        }


        bubble.textContent =
            String(text);


        message.appendChild(
            bubble
        );


        chat.appendChild(
            message
        );


        chat.scrollTop =
            chat.scrollHeight;
    }


    // =====================================================
    // CHARGEMENT
    // =====================================================

    function addLoading() {

        const message =
            document.createElement("div");

        message.className =
            "message ai";

        message.id =
            "loadingMessage";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        const loading =
            document.createElement("div");

        loading.className =
            "loading";


        loading.innerHTML = `
            <span></span>
            <span></span>
            <span></span>
        `;


        bubble.appendChild(
            loading
        );


        message.appendChild(
            bubble
        );


        chat.appendChild(
            message
        );


        chat.scrollTop =
            chat.scrollHeight;
    }


    // =====================================================
    // SUPPRIMER LE CHARGEMENT
    // =====================================================

    function removeLoading() {

        const loading =
            document.getElementById(
                "loadingMessage"
            );


        if (loading) {

            loading.remove();

        }
    }


    // =====================================================
    // ENVOYER MESSAGE
    // =====================================================

    async function sendMessage() {

        const message =
            input.value.trim();


        if (!message) {

            return;

        }


        // Retirer l'accueil

        if (welcome) {

            welcome.remove();

        }


        // Afficher le message utilisateur

        addMessage(
            message,
            "user"
        );


        // =================================================
        // AJOUTER LE MESSAGE À LA MÉMOIRE
        // =================================================

        conversationHistory.push({
            role: "user",
            content: message
        });


        // Garder seulement les 20 derniers messages

        conversationHistory =
            conversationHistory.slice(-20);


        // Vider le champ

        input.value = "";

        input.style.height =
            "45px";


        // Désactiver le bouton

        sendButton.disabled =
            true;


        // Afficher chargement

        addLoading();


        try {

            // =================================================
            // ENVOYER MESSAGE + HISTORIQUE AU SERVEUR
            // =================================================

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                message: message,

                                history:
                                    conversationHistory

                            })
                    }
                );


            // =================================================
            // RÉCUPÉRER LA RÉPONSE
            // =================================================

            const data =
                await response.json();


            removeLoading();


            // =================================================
            // ERREUR
            // =================================================

            if (!response.ok) {

                // Retirer le dernier message utilisateur
                // de l'historique en cas d'erreur

                conversationHistory.pop();


                addMessage(
                    "❌ " +
                    (
                        data.error ||
                        "Une erreur est survenue."
                    ),
                    "ai"
                );


                return;
            }


            // =================================================
            // RÉPONSE DE MESSIE IA
            // =================================================

            const answer =
                data.response;


            addMessage(
                answer,
                "ai"
            );


            // =================================================
            // AJOUTER LA RÉPONSE À LA MÉMOIRE
            // =================================================

            conversationHistory.push({

                role: "assistant",

                content: answer

            });


            // Garder les 20 derniers messages

            conversationHistory =
                conversationHistory.slice(-20);

        }


        // =====================================================
        // ERREUR RÉSEAU
        // =====================================================

        catch (error) {

            removeLoading();


            // Retirer le message utilisateur
            // puisque la requête n'a pas fonctionné

            conversationHistory.pop();


            console.error(
                "Erreur Messie IA :",
                error
            );


            addMessage(
                "❌ Impossible de contacter Messie IA. Vérifie ta connexion ou le serveur.",
                "ai"
            );

        }


        // =====================================================
        // FIN
        // =====================================================

        finally {

            sendButton.disabled =
                false;

            input.focus();

        }

    }


    // =====================================================
    // BOUTON ENVOYER
    // =====================================================

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    // =====================================================
    // TOUCHE ENTRÉE
    // =====================================================

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // =====================================================
    // AGRANDIR LE TEXTAREA
    // =====================================================

    input.addEventListener(
        "input",
        function() {

            this.style.height =
                "45px";


            this.style.height =
                Math.min(
                    this.scrollHeight,
                    140
                ) + "px";

        }
    );

</script>

</body>

    </html>
