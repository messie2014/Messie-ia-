<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messie IA</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==================================================
           HEADER
        ================================================== */

        header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #292d35;
            background: #151821;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #111111;
            font-weight: bold;
        }

        .status {
            font-size: 12px;
            color: #7ee787;
        }

        /* ==================================================
           CHAT
        ================================================== */

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .welcome {
            max-width: 700px;
            margin: 50px auto;
            text-align: center;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #a7adb8;
            line-height: 1.6;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 18px auto;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 80%;
            padding: 13px 16px;
            border-radius: 16px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user .bubble {
            background: #2d6cdf;
            border-bottom-right-radius: 5px;
        }

        .assistant .bubble {
            background: #1d2129;
            border: 1px solid #2b303a;
            border-bottom-left-radius: 5px;
        }

        .error {
            color: #ff7777;
        }

        /* ==================================================
           INPUT
        ================================================== */

        .composer-area {
            padding: 12px;
            border-top: 1px solid #292d35;
            background: #151821;
        }

        .composer {
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            padding: 13px;
            border: 1px solid #343945;
            border-radius: 14px;
            outline: none;
            background: #0f1115;
            color: white;
            font-size: 15px;
        }

        textarea:focus {
            border-color: #4b78d1;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .send {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #2d6cdf;
            color: white;
            font-size: 19px;
        }

        .send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tools {
            max-width: 900px;
            margin: 8px auto 0 auto;
            display: flex;
            gap: 8px;
        }

        .tool {
            background: #242933;
            color: #ddd;
            border: 1px solid #343945;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
        }

        .tool:hover {
            background: #2c323e;
        }

        input[type="file"] {
            display: none;
        }

        /* ==================================================
           IMAGE PREVIEW
        ================================================== */

        #preview-container {
            max-width: 900px;
            margin: 0 auto 10px auto;
            display: none;
        }

        #preview {
            max-width: 180px;
            max-height: 180px;
            border-radius: 12px;
            border: 1px solid #343945;
        }

        /* ==================================================
           LOADING
        ================================================== */

        .typing {
            display: inline-flex;
            gap: 4px;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: #aaa;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0.3;
            }

            40% {
                opacity: 1;
            }
        }

        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 600px) {

            header {
                height: 58px;
            }

            #chat {
                padding: 12px;
            }

            .welcome {
                margin: 30px auto;
            }

            .welcome h1 {
                font-size: 26px;
            }

            .bubble {
                max-width: 88%;
            }

            .composer-area {
                padding: 8px;
            }

            .tools {
                overflow-x: auto;
            }

        }

    </style>

</head>


<body>

<div class="app">


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header>

        <div class="logo">

            <div class="logo-icon">
                M
            </div>

            <span>
                Messie IA
            </span>

        </div>


        <div
            id="status"
            class="status"
        >
            ● En ligne
        </div>

    </header>


    <!-- ==================================================
         CHAT
    ================================================== -->

    <main id="chat">

        <div
            id="welcome"
            class="welcome"
        >

            <h1>
                Bonjour 👋
            </h1>

            <p>
                Je suis <strong>Messie IA</strong>.
                Pose-moi une question pour commencer.
            </p>

        </div>

    </main>


    <!-- ==================================================
         COMPOSER
    ================================================== -->

    <div class="composer-area">


        <!-- PREVIEW IMAGE -->

        <div id="preview-container">

            <img
                id="preview"
                alt="Image sélectionnée"
            >

        </div>


        <div class="composer">

            <textarea
                id="message"
                placeholder="Écris ton message..."
                rows="1"
            ></textarea>


            <button
                id="send"
                class="send"
                title="Envoyer"
            >
                ➤
            </button>

        </div>


        <div class="tools">

            <label
                class="tool"
                for="image-input"
            >
                🖼️ Image
            </label>


            <input
                id="image-input"
                type="file"
                accept="image/*"
            >


            <button
                id="analyze-button"
                class="tool"
                type="button"
            >
                🔍 Analyser
            </button>


            <button
                id="clear-button"
                class="tool"
                type="button"
            >
                🗑️ Effacer
            </button>

        </div>

    </div>


</div>


<script>

    // =====================================================
    // VARIABLES
    // =====================================================

    const chat =
        document.getElementById("chat");

    const welcome =
        document.getElementById("welcome");

    const messageInput =
        document.getElementById("message");

    const sendButton =
        document.getElementById("send");

    const imageInput =
        document.getElementById("image-input");

    const analyzeButton =
        document.getElementById("analyze-button");

    const clearButton =
        document.getElementById("clear-button");

    const preview =
        document.getElementById("preview");

    const previewContainer =
        document.getElementById("preview-container");


    let history = [];

    let selectedImage = null;

    let loading = false;


    // =====================================================
    // AJOUT MESSAGE
    // =====================================================

    function addMessage(
        role,
        text
    ) {

        if (welcome) {
            welcome.style.display = "none";
        }


        const wrapper =
            document.createElement("div");


        wrapper.className =
            "message " + role;


        const bubble =
            document.createElement("div");


        bubble.className =
            "bubble";


        bubble.textContent =
            text;


        wrapper.appendChild(
            bubble
        );


        chat.appendChild(
            wrapper
        );


        chat.scrollTop =
            chat.scrollHeight;


        return bubble;
    }


    // =====================================================
    // INDICATEUR
    // =====================================================

    function addTyping() {

        if (welcome) {
            welcome.style.display = "none";
        }


        const wrapper =
            document.createElement("div");


        wrapper.className =
            "message assistant";


        wrapper.id =
            "typing-message";


        const bubble =
            document.createElement("div");


        bubble.className =
            "bubble";


        bubble.innerHTML = `
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;


        wrapper.appendChild(
            bubble
        );


        chat.appendChild(
            wrapper
        );


        chat.scrollTop =
            chat.scrollHeight;
    }


    function removeTyping() {

        const element =
            document.getElementById(
                "typing-message"
            );


        if (element) {
            element.remove();
        }
    }


    // =====================================================
    // ENVOYER MESSAGE
    // =====================================================

    async function sendMessage() {

        if (loading) {
            return;
        }


        const text =
            messageInput.value.trim();


        if (!text) {
            return;
        }


        addMessage(
            "user",
            text
        );


        messageInput.value = "";


        messageInput.style.height =
            "48px";


        loading = true;

        sendButton.disabled =
            true;


        addTyping();


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                message:
                                    text,

                                history:
                                    history

                            })

                    }
                );


            const data =
                await response.json();


            removeTyping();


            if (!response.ok || !data.success) {

                const error =
                    data.error ||
                    "Une erreur est survenue.";

                addMessage(
                    "assistant",
                    "❌ " + error
                );

                return;
            }


            const answer =
                data.response ||
                "Je n'ai pas reçu de réponse.";


            addMessage(
                "assistant",
                answer
            );


            history.push({

                role:
                    "user",

                content:
                    text

            });


            history.push({

                role:
                    "assistant",

                content:
                    answer

            });


        }

        catch (error) {

            removeTyping();


            addMessage(

                "assistant",

                "❌ Impossible de contacter Messie IA."

            );


            console.error(
                error
            );

        }

        finally {

            loading = false;

            sendButton.disabled =
                false;

            messageInput.focus();

        }

    }


    // =====================================================
    // IMAGE
    // =====================================================

    imageInput.addEventListener(
        "change",
        function () {

            const file =
                this.files[0];


            if (!file) {

                selectedImage =
                    null;

                previewContainer.style.display =
                    "none";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    selectedImage =
                        event.target.result;


                    preview.src =
                        selectedImage;


                    previewContainer.style.display =
                        "block";

                };


            reader.readAsDataURL(
                file
            );

        }
    );


    // =====================================================
    // ANALYSE IMAGE
    // =====================================================

    analyzeButton.addEventListener(
        "click",
        async function () {

            if (!selectedImage) {

                addMessage(
                    "assistant",
                    "📷 Sélectionne d'abord une image."
                );

                return;
            }


            if (loading) {
                return;
            }


            loading = true;

            analyzeButton.disabled =
                true;


            addTyping();


            try {

                const response =
                    await fetch(
                        "/api/analyze-image",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    image:
                                        selectedImage,

                                    prompt:
                                        messageInput.value.trim()
                                        ||
                                        "Décris cette image en détail."

                                })

                        }
                    );


                const data =
                    await response.json();


                removeTyping();


                if (!response.ok || !data.success) {

                    addMessage(
                        "assistant",
                        "❌ " +
                        (
                            data.error ||
                            "Impossible d'analyser l'image."
                        )
                    );

                    return;
                }


                addMessage(
                    "assistant",
                    data.response ||
                    "Analyse terminée."
                );

            }

            catch (error) {

                removeTyping();

                addMessage(
                    "assistant",
                    "❌ Erreur pendant l'analyse de l'image."
                );

                console.error(
                    error
                );

            }

            finally {

                loading = false;

                analyzeButton.disabled =
                    false;

            }

        }
    );


    // =====================================================
    // EFFACER
    // =====================================================

    clearButton.addEventListener(
        "click",
        function () {

            history = [];

            selectedImage =
                null;

            chat.innerHTML = "";


            const newWelcome =
                document.createElement(
                    "div"
                );


            newWelcome.className =
                "welcome";


            newWelcome.innerHTML = `
                <h1>
                    Bonjour 👋
                </h1>

                <p>
                    Je suis <strong>Messie IA</strong>.
                    Pose-moi une question pour commencer.
                </p>
            `;


            chat.appendChild(
                newWelcome
            );


            previewContainer.style.display =
                "none";


            imageInput.value =
                "";


            messageInput.value =
                "";

        }
    );


    // =====================================================
    // ENTRÉE CLAVIER
    // =====================================================

    messageInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // =====================================================
    // AUTO-AGRANDISSEMENT
    // =====================================================

    messageInput.addEventListener(
        "input",
        function () {

            this.style.height =
                "48px";


            this.style.height =
                Math.min(
                    this.scrollHeight,
                    150
                ) + "px";

        }
    );


    // =====================================================
    // BOUTON ENVOYER
    // =====================================================

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    // =====================================================
    // TEST DU SERVEUR
    // =====================================================

    fetch("/health")
        .then(
            response =>
                response.json()
        )
        .then(
            data => {

                const status =
                    document.getElementById(
                        "status"
                    );


                if (
                    data &&
                    data.status === "ok"
                ) {

                    status.textContent =
                        "● Serveur actif";

                }

            }
        )
        .catch(
            error => {

                console.error(
                    error
                );

            }
        );

</script>

</body>

</html>
