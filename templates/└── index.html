<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messie IA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1117;
            color: #ffffff;
            min-height: 100vh;
        }

        button,
        textarea,
        select,
        input {
            font: inherit;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==================================================
           HEADER
        ================================================== */

        header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: #171a22;
            border-bottom: 1px solid #292d38;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            font-weight: bold;
        }

        .status {
            font-size: 12px;
            color: #9ca3af;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 5px;
        }

        /* ==================================================
           MAIN
        ================================================== */

        main {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            padding: 24px 15px 130px;
            flex: 1;
        }

        .welcome {
            text-align: center;
            padding: 40px 10px 25px;
        }

        .welcome h1 {
            font-size: 32px;
            margin: 0 0 10px;
        }

        .welcome p {
            color: #9ca3af;
            margin: 0;
        }

        /* ==================================================
           MESSAGES
        ================================================== */

        #messages {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            width: 100%;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 85%;
            padding: 13px 16px;
            border-radius: 18px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user .bubble {
            background: #2563eb;
            border-bottom-right-radius: 5px;
        }

        .assistant .bubble {
            background: #1b1f29;
            border: 1px solid #292d38;
            border-bottom-left-radius: 5px;
        }

        .bubble img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
        }

        /* ==================================================
           IMAGE GENERATOR
        ================================================== */

        .panel {
            background: #171a22;
            border: 1px solid #292d38;
            border-radius: 18px;
            padding: 18px;
            margin-top: 25px;
        }

        .panel-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .panel-subtitle {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            resize: vertical;
            background: #0f1117;
            color: white;
            border: 1px solid #343946;
            border-radius: 12px;
            padding: 13px;
            outline: none;
        }

        textarea:focus {
            border-color: #6366f1;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .control label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 10px;
            background: #0f1117;
            color: white;
            border: 1px solid #343946;
            border-radius: 10px;
            outline: none;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        button {
            border: 0;
            cursor: pointer;
            border-radius: 11px;
            padding: 11px 16px;
            color: white;
            background: #292d38;
        }

        button:hover {
            opacity: 0.9;
        }

        button.primary {
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .file-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #292d38;
            padding: 11px 16px;
            border-radius: 11px;
            cursor: pointer;
        }

        #imageInput {
            display: none;
        }

        /* ==================================================
           GENERATION STATUS
        ================================================== */

        #generationStatus {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border-radius: 12px;
            background: #111827;
            border: 1px solid #374151;
            color: #c4b5fd;
        }

        .loader {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid #555;
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: -3px;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ==================================================
           GENERATED IMAGES
        ================================================== */

        #imageResults {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 18px;
        }

        .generated-image {
            background: #0f1117;
            border: 1px solid #292d38;
            border-radius: 15px;
            padding: 8px;
        }

        .generated-image img {
            width: 100%;
            display: block;
            border-radius: 10px;
        }

        .image-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .image-actions button {
            flex: 1;
            font-size: 13px;
        }

        /* ==================================================
           IMAGE PREVIEW
        ================================================== */

        #referencePreview {
            display: none;
            margin-top: 12px;
            position: relative;
        }

        #referencePreview img {
            max-width: 180px;
            max-height: 180px;
            border-radius: 12px;
            border: 1px solid #343946;
        }

        #removeReference {
            position: absolute;
            left: 150px;
            top: -8px;
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 50%;
            background: #dc2626;
        }

        /* ==================================================
           CHAT BAR
        ================================================== */

        .chat-area {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 15px;
            background: rgba(15, 17, 23, 0.95);
            border-top: 1px solid #292d38;
            backdrop-filter: blur(10px);
            z-index: 15;
        }

        .chat-box {
            max-width: 1000px;
            margin: auto;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        #chatInput {
            min-height: 48px;
            max-height: 150px;
            resize: none;
        }

        #sendButton {
            height: 48px;
            min-width: 48px;
            padding: 0 15px;
        }

        /* ==================================================
           RESPONSIVE
        ================================================== */

        @media (max-width: 700px) {

            .controls {
                grid-template-columns: repeat(2, 1fr);
            }

            .welcome h1 {
                font-size: 27px;
            }

            .bubble {
                max-width: 92%;
            }

            .panel {
                padding: 14px;
            }
        }

        @media (max-width: 450px) {

            .controls {
                grid-template-columns: 1fr 1fr;
            }

            .logo {
                font-size: 17px;
            }

            .status {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="logo">

            <div class="logo-icon">
                M
            </div>

            <span>Messie IA</span>

        </div>

        <div class="status">

            <span class="status-dot"></span>

            En ligne

        </div>

    </header>


    <!-- =====================================================
         CONTENU
    ====================================================== -->

    <main>

        <section class="welcome" id="welcome">

            <h1>Bonjour 👋</h1>

            <p>
                Je suis Messie IA
