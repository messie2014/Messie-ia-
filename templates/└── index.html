<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b1020"
    >

    <title>Messie IA</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #0b1020;
            color: white;
        }


        body {
            overflow: hidden;
        }


        button,
        textarea,
        select,
        input {
            font: inherit;
        }


        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* ====================================================
           HEADER
        ==================================================== */

        .header {
            height: 68px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: #10172a;
            border-bottom:
                1px solid
                rgba(255,255,255,.08);
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .logo {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: bold;
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );
        }


        .brand h1 {
            margin: 0;
            font-size: 18px;
        }


        .brand small {
            display: block;
            color: #94a3b8;
            margin-top: 2px;
        }


        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #94a3b8;
            font-size: 12px;
        }


        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow:
                0 0 10px
                #22c55e;
        }


        /* ====================================================
           MESSAGES
        ==================================================== */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding:
                25px
                15px
                180px;
        }


        .welcome {
            max-width: 700px;
            margin: 55px auto;
            text-align: center;
        }


        .welcome-icon {
            width: 75px;
            height: 75px;
            margin: auto auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            font-size: 38px;
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );
        }


        .welcome h2 {
            margin: 0 0 10px;
            font-size: 28px;
        }


        .welcome p {
            color: #94a3b8;
            line-height: 1.6;
        }


        .suggestions {
            margin-top: 25px;
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(170px, 1fr)
                );
            gap: 10px;
        }


        .suggestion {
            padding: 14px;
            border-radius: 14px;
            border:
                1px solid
                rgba(255,255,255,.08);
            background: #121b30;
            color: #dbe4f0;
            cursor: pointer;
            text-align: left;
        }


        .suggestion:hover {
            background: #1a2742;
        }


        .message {
            max-width: 900px;
            margin:
                0 auto
                18px;
            display: flex;
            gap: 10px;
        }


        .message.user {
            justify-content: flex-end;
        }


        .avatar {
            width: 35px;
            height: 35px;
            flex-shrink: 0;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1f2937;
        }


        .message.assistant .avatar {
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );
        }


        .bubble {
            max-width: 80%;
            padding:
                13px
                16px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            border-radius: 17px;
        }


        .message.user .bubble {
            background: #2563eb;
            border-bottom-right-radius: 5px;
        }


        .message.assistant .bubble {
            background: #151d31;
            border:
                1px solid
                rgba(255,255,255,.06);
            border-bottom-left-radius: 5px;
        }


        /* ====================================================
           GENERATED IMAGES
        ==================================================== */

        .generated-image {
            max-width: 100%;
            margin-top: 8px;
            border-radius: 15px;
            display: block;
            cursor: pointer;
        }


        .image-actions {
            display: flex;
            gap: 7px;
            margin-top: 9px;
            flex-wrap: wrap;
        }


        .image-action {
            padding: 7px 10px;
            border: 0;
            border-radius: 9px;
            background: #24304a;
            color: #dbe4f0;
            cursor: pointer;
            font-size: 12px;
        }


        /* ====================================================
           TYPING
        ==================================================== */

        .typing {
            display: flex;
            gap: 5px;
            padding: 13px 15px;
            background: #151d31;
            border-radius: 17px;
        }


        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #94a3b8;
            animation:
                typing 1.2s infinite;
        }


        .typing span:nth-child(2) {
            animation-delay: .15s;
        }


        .typing span:nth-child(3) {
            animation-delay: .3s;
        }


        @keyframes typing {

            0%,
            60%,
            100% {
                transform:
                    translateY(0);
                opacity: .4;
            }

            30% {
                transform:
                    translateY(-5px);
                opacity: 1;
            }

        }


        /* ====================================================
           COMPOSER
        ==================================================== */

        .composer-area {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding:
                10px
                12px
                18px;
            background:
                linear-gradient(
                    to top,
                    #0b1020 75%,
                    transparent
                );
        }


        .tools {
            max-width: 900px;
            margin: 0 auto 8px;
            display: flex;
            gap: 7px;
            overflow-x: auto;
        }


        .tool {
            flex-shrink: 0;
            padding:
                8px
                11px;
            border-radius: 11px;
            border:
                1px solid
                rgba(255,255,255,.08);
            background: #151d31;
            color: #dbe4f0;
            cursor: pointer;
            font-size: 12px;
        }


        .composer {
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            padding: 9px;
            border-radius: 19px;
            background: #151d31;
            border:
                1px solid
                rgba(255,255,255,.08);
        }


        textarea {
            flex: 1;
            min-width: 0;
            max-height: 150px;
            resize: none;
            border: 0;
            outline: 0;
            padding: 8px;
            color: white;
            background: transparent;
        }


        textarea::placeholder {
            color: #64748b;
        }


        .send {
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 13px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }


        .send:disabled {
            opacity: .5;
        }


        /* ====================================================
           PREVIEW
        ==================================================== */

        .preview {
            max-width: 900px;
            margin:
                0 auto
                8px;
            padding: 8px;
            display: none;
            align-items: center;
            gap: 10px;
            border-radius: 13px;
            background: #151d31;
        }


        .preview img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 9px;
        }


        .preview-info {
            flex: 1;
        }


        .preview-info strong {
            display: block;
        }


        .preview-info small {
            color: #94a3b8;
        }


        .remove {
            border: 0;
            background: transparent;
            color: #ef4444;
            font-size: 20px;
            cursor: pointer;
        }


        input[type="file"] {
            display: none;
        }


        /* ====================================================
           MODAL
        ==================================================== */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background:
                rgba(0,0,0,.75);
        }


        .modal.active {
            display: flex;
        }


        .modal-card {
            width:
                min(
                    650px,
                    100%
                );
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            border-radius: 20px;
            background: #111827;
        }


        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }


        .modal-header h3 {
            margin: 0;
        }


        .close {
            border: 0;
            background: transparent;
            color: #94a3b8;
            font-size: 25px;
            cursor: pointer;
        }


        .field {
            margin-bottom: 15px;
        }


        .field label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
            font-size: 13px;
        }


        .field textarea {
            width: 100%;
            min-height: 90px;
            max-height: 200px;
            padding: 12px;
            border-radius: 12px;
            background: #0b1020;
            border:
                1px solid
                rgba(255,255,255,.1);
        }


        select {
            width: 100%;
            padding: 11px;
            border-radius: 11px;
            border:
                1px solid
                rgba(255,255,255,.1);
            background: #0b1020;
            color: white;
            outline: none;
        }


        .options {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);
            gap: 10px;
        }


        .generate {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }


        .generate:disabled {
            opacity: .5;
        }


        .modal-preview {
            display: none;
            margin-top: 15px;
        }


        .modal-preview img {
            width: 100%;
            border-radius: 15px;
        }


        @media (max-width: 600px) {

            .header {
                height: 62px;
            }


            .status {
                display: none;
            }


            .messages {
                padding:
                    15px
                    10px
                    180px;
            }


            .welcome {
                margin:
                    30px
                    auto;
            }


            .welcome h2 {
                font-size: 24px;
            }


            .bubble {
                max-width: 88%;
            }


            .options {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- ====================================================
         HEADER
    ===================================================== -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                M
            </div>

            <div>

                <h1>
                    Messie IA
                </h1>

                <small>
                    Assistant intelligent
                </small>

            </div>

        </div>


        <div class="status">

            <span
                class="status-dot"
                id="statusDot"
            ></span>

            <span id="statusText">
                Vérification...
            </span>

        </div>

    </header>


    <!-- ====================================================
         MESSAGES
    ===================================================== -->

    <main
        class="messages"
        id="messages"
    >

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-icon">
                ✨
            </div>

            <h2>
                Bonjour, je suis Messie IA
            </h2>

            <p>
                Pose-moi une question, demande-moi
                de créer une image, d'analyser une
                image, d'écrire du code ou de t'aider
                dans ton projet.
            </p>


            <div class="suggestions">

                <button
                    class="suggestion"
                    onclick="
                        setMessage(
                            'Aide-moi à créer une application gratuitement.'
                        )
                    "
                >
                    💻 Créer une application
                </button>


                <button
                    class="suggestion"
                    onclick="
                        setMessage(
                            'Explique-moi Python simplement.'
                        )
                    "
                >
                    🐍 Apprendre Python
                </button>


                <button
                    class="suggestion"
                    onclick="
                        setMessage(
                            'Donne-moi une idée de projet innovant.'
                        )
                    "
                >
                    💡 Idée de projet
                </button>


                <button
                    class="suggestion"
                    onclick="
                        openImageModal()
                    "
                >
                    🎨 Créer une image
                </button>

            </div>

        </div>

    </main>


    <!-- ====================================================
         COMPOSER
    ===================================================== -->

    <div class="composer-area">


        <div
            class="preview"
            id="preview"
        >

            <img
                id="previewImage"
                src=""
                alt="Image"
            >


            <div class="preview-info">

                <strong>
                    Image sélectionnée
                </strong>

                <small id="previewName">
                    Image
                </small>

            </div>


            <button
                class="remove"
                onclick="removeReference()"
            >
                ×
            </button>

        </div>


        <div class="tools">

            <button
                class="tool"
                onclick="
                    document
                    .getElementById('imageInput')
                    .click()
                "
            >
                📷 Analyser
            </button>


            <button
                class="tool"
                onclick="
                    openImageModal()
                "
            >
                🎨 Générer
            </button>


            <button
                class="tool"
                onclick="
                    clearConversation()
                "
            >
                🗑️ Nouvelle conversation
            </button>

        </div>


        <div class="composer">

            <textarea
                id="messageInput"
                rows="1"
                maxlength="12000"
                placeholder="Écrivez votre message à Messie IA..."
            ></textarea>


            <button
                class="send"
                id="sendButton"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<!-- ========================================================
     IMAGE INPUT
========================================================= -->

<input
    type="file"
    id="imageInput"
    accept="image/*"
>


<!-- ========================================================
     GÉNÉRATION IMAGE MODAL
========================================================= -->

<div
    class="modal"
    id="imageModal"
>

    <div class="modal-card">


        <div class="modal-header">

            <h3>
                🎨 Générer une image
            </h3>

            <button
                class="close"
                onclick="closeImageModal()"
            >
                ×
            </button>

        </div>


        <div class="field">

            <label>
                Description de l'image
            </label>

            <textarea
                id="imagePrompt"
                placeholder="Exemple : une ville futuriste à Lubumbashi au coucher du soleil, style cinématographique..."
            ></textarea>

        </div>


        <div class="field">

            <label>
                Image de référence
            </label>

            <input
                type="file"
                id="referenceInput"
                accept="image/*"
                style="display:block;"
            >

        </div>


        <div class="options">


            <div class="field">

                <label>
                    Format
                </label>

                <select
                    id="imageRatio"
                >

                    <option value="1:1">
                        Carré 1:1
                    </option>

                    <option value="16:9">
                        Paysage 16:9
                    </option>

                    <option value="9:16">
                        Portrait 9:16
                    </option>

                    <option value="4:3">
                        Paysage 4:3
                    </option>

                    <option value="3:4">
                        Portrait 3:4
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    Résolution
                </label>

                <select
                    id="imageResolution"
                >

                    <option value="1K">
                        1K
                    </option>

                    <option value="2K">
                        2K
                    </option>

                    <option value="4K">
                        4K
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    Qualité
                </label>

                <select
                    id="imageQuality"
                >

                    <option value="auto">
                        Automatique
                    </option>

                    <option value="low">
                        Faible
                    </option>

                    <option value="medium">
                        Moyenne
                    </option>

                    <option value="high">
                        Haute
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    Nombre
                </label>

                <select
                    id="imageCount"
                >

                    <option value="1">
                        1 image
                    </option>

                    <option value="2">
                        2 images
                    </option>

                    <option value="3">
                        3 images
                    </option>

                    <option value="4">
                        4 images
                    </option>

                </select>

            </div>

        </div>


        <button
            class="generate"
            id="generateButton"
            onclick="generateImage()"
        >
            ✨ Générer l'image
        </button>


        <div
            class="modal-preview"
            id="generatedPreview"
        ></div>


    </div>

</div>


<script>

    // ========================================================
    // VARIABLES
    // ========================================================

    const messages =
        document.getElementById(
            "messages"
        );


    const welcome =
        document.getElementById(
            "welcome"
        );


    const messageInput =
        document.getElementById(
            "messageInput"
        );


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const imageInput =
        document.getElementById(
            "imageInput"
        );


    const preview =
        document.getElementById(
            "preview"
        );


    const previewImage =
        document.getElementById(
            "previewImage"
        );


    const previewName =
        document.getElementById(
            "previewName"
        );


    let history = [];

    let selectedImage = null;

    let sending = false;


    // ========================================================
    // HISTORIQUE
    // ========================================================

    try {

        const saved =
            localStorage.getItem(
                "messie_ia_history"
            );


        if (saved) {

            const parsed =
                JSON.parse(
                    saved
                );


            if (Array.isArray(parsed)) {

                history =
                    parsed.slice(-30);


                for (
                    const item of history
                ) {

                    if (
                        item.role === "user" ||
                        item.role === "assistant"
                    ) {

                        addMessage(
                            item.role,
                            item.content,
                            false
                        );

                    }

                }


                if (history.length) {

                    welcome.style.display =
                        "none";

                }

            }

        }

    } catch (error) {

        console.warn(
            "Historique indisponible.",
            error
        );

    }


    function saveHistory() {

        try {

            localStorage.setItem(

                "messie_ia_history",

                JSON.stringify(
                    history.slice(-30)
                )

            );

        } catch (error) {

            console.warn(
                "Impossible de sauvegarder.",
                error
            );

        }

    }


    // ========================================================
    // AJOUT MESSAGE
    // ========================================================

    function addMessage(
        role,
        content,
        scroll = true
    ) {

        welcome.style.display =
            "none";


        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "message " +
            role;


        const avatar =
            document.createElement(
                "div"
            );


        avatar.className =
            "avatar";


        avatar.textContent =
            role === "user"
                ? "👤"
                : "M";


        const bubble =
            document.createElement(
                "div"
            );


        bubble.className =
            "bubble";


        bubble.textContent =
            content;


        if (role === "user") {

            wrapper.appendChild(
                bubble
            );

            wrapper.appendChild(
                avatar
            );

        } else {

            wrapper.appendChild(
                avatar
            );

            wrapper.appendChild(
                bubble
            );

        }


        messages.appendChild(
            wrapper
        );


        if (scroll) {

            scrollBottom();

        }


        return bubble;

    }


    // ========================================================
    // AJOUT IMAGE
    // ========================================================

    function addGeneratedImage(
        src
    ) {

        welcome.style.display =
            "none";


        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "message assistant";


        const avatar =
            document.createElement(
                "div"
            );


        avatar.className =
            "avatar";


        avatar.textContent =
            "M";


        const bubble =
            document.createElement(
                "div"
            );


        bubble.className =
            "bubble";


        const img =
            document.createElement(
                "img"
            );


        img.className =
            "generated-image";


        img.src =
            src;


        img.alt =
            "Image générée par Messie IA";


        img.onclick =
            function() {

                window.open(
                    src,
                    "_blank"
                );

            };


        const actions =
            document.createElement(
                "div"
            );


        actions.className =
            "image-actions";


        const download =
            document.createElement(
                "button"
            );


        download.className =
            "image-action";


        download.textContent =
            "⬇️ Télécharger";


        download.onclick =
            function() {

                downloadImage(
                    src
                );

            };


        actions.appendChild(
            download
        );


        bubble.appendChild(
            img
        );


        bubble.appendChild(
            actions
        );


        wrapper.appendChild(
            avatar
        );


        wrapper.appendChild(
            bubble
        );


        messages.appendChild(
            wrapper
        );


        scrollBottom();

    }


    // ========================================================
    // DOWNLOAD
    // ========================================================

    function downloadImage(
        src
    ) {

        const link =
            document.createElement(
                "a"
            );


        link.href =
            src;


        link.download =
            "messie-ia-image.png";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();

    }


    // ========================================================
    // TYPING
    // ========================================================

    function showTyping() {

        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.id =
            "typing";


        wrapper.className =
            "message assistant";


        const avatar =
            document.createElement(
                "div"
            );


        avatar.className =
            "avatar";


        avatar.textContent =
            "M";


        const typing =
            document.createElement(
                "div"
            );


        typing.className =
            "typing";


        typing.innerHTML =
            "<span></span><span></span><span></span>";


        wrapper.appendChild(
            avatar
        );


        wrapper.appendChild(
            typing
        );


        messages.appendChild(
            wrapper
        );


        scrollBottom();

    }


    function hideTyping() {

        const element =
            document.getElementById(
                "typing"
            );


        if (element) {

            element.remove();

        }

    }


    // ========================================================
    // SCROLL
    // ========================================================

    function scrollBottom() {

        messages.scrollTo({

            top:
                messages.scrollHeight,

            behavior:
                "smooth"

        });

    }


    // ========================================================
    // CHAT
    // ========================================================

    async function sendMessage() {

        if (sending) {

            return;

        }


        const text =
            messageInput.value.trim();


        // Si une image est sélectionnée,
        // on analyse l'image.
        if (selectedImage) {

            await analyzeImage(
                text ||
                "Décris cette image en détail."
            );

            return;

        }


        if (!text) {

            return;

        }


        sending =
            true;


        sendButton.disabled =
            true;


        messageInput.value =
            "";


        resizeTextarea();


        addMessage(
            "user",
            text
        );


        const previousHistory =
            history.slice(-30);


        history.push({

            role:
                "user",

            content:
                text

        });


        saveHistory();


        showTyping();


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                message:
                                    text,

                                history:
                                    previousHistory

                            })

                    }
                );


            const data =
                await response.json()
                    .catch(
                        () => ({})
                    );


            hideTyping();


            if (!response.ok) {

                throw new Error(

                    data.error ||
                    "Erreur du serveur."

                );

            }


            const answer =
                data.response ||
                "Aucune réponse reçue.";


            addMessage(
                "assistant",
                answer
            );


            history.push({

                role:
                    "assistant",

                content:
                    answer

            });


            saveHistory();


            setStatus(
                true
            );

        } catch (error) {

            hideTyping();


            addMessage(

                "assistant",

                "❌ " +
                (
                    error.message ||
                    "Erreur de connexion."
                )

            );


            setStatus(
                false
            );

        } finally {

            sending =
                false;


            sendButton.disabled =
                false;


            messageInput.focus();

        }

    }


    // ========================================================
    // IMAGE INPUT
    // ========================================================

    imageInput.addEventListener(
        "change",
        function() {

            const file =
                imageInput.files[0];


            if (!file) {

                return;

            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                alert(
                    "Sélectionne une image."
                );

                return;

            }


            if (
                file.size >
                15 * 1024 * 1024
            ) {

                alert(
                    "Image trop volumineuse. Maximum 15 Mo."
                );

                imageInput.value =
                    "";

                return;

            }


            selectedImage =
                file;


            previewName.textContent =
                file.name;


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    previewImage.src =
                        event.target.result;

                };


            reader.readAsDataURL(
                file
            );


            preview.style.display =
                "flex";


            messageInput.placeholder =
                "Que veux-tu savoir sur cette image ?";

        }
    );


    // ========================================================
    // ANALYSE IMAGE
    // ========================================================

    async function analyzeImage(
        prompt
    ) {

        if (!selectedImage) {

            return;

        }


        sending =
            true;


        sendButton.disabled =
            true;


        const file =
            selectedImage;


        removeReference();


        addMessage(
            "user",
            "📷 " + prompt
        );


        showTyping();


        try {

            const base64 =
                await fileToBase64(
                    file
                );


            const response =
                await fetch(
                    "/api/analyze-image",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                image:
                                    base64,

                                prompt:
                                    prompt

                            })

                    }
                );


            const data =
                await response.json()
                    .catch(
                        () => ({})
                    );


            hideTyping();


            if (!response.ok) {

                throw new Error(

                    data.error ||
                    "Erreur pendant l'analyse."

                );

            }


            const answer =
                data.response ||
                "Je n'ai pas pu analyser cette image.";


            addMessage(
                "assistant",
                answer
            );


            setStatus(
                true
            );

        } catch (error) {

            hideTyping();


            addMessage(

                "assistant",

                "❌ " +
                (
                    error.message ||
                    "Impossible d'analyser l'image."
                )

            );


            setStatus(
                false
            );

        } finally {

            sending =
                false;


            sendButton.disabled =
                false;

        }

    }


    // ========================================================
    // FILE TO BASE64
    // ========================================================

    function fileToBase64(
        file
    ) {

        return new Promise(
            function(resolve, reject) {

                const reader =
                    new FileReader();


                reader.onload =
                    function() {

                        resolve(
                            reader.result
                        );

                    };


                reader.onerror =
                    function() {

                        reject(
                            new Error(
                                "Impossible de lire l'image."
                            )
                        );

                    };


                reader.readAsDataURL(
                    file
                );

            }
        );

    }


    // ========================================================
    // REMOVE REFERENCE
    // ========================================================

    function removeReference() {

        selectedImage =
            null;


        preview.style.display =
            "none";


        previewImage.src =
            "";


        previewName.textContent =
            "";


        imageInput.value =
            "";


        messageInput.placeholder =
            "Écrivez votre message à Messie IA...";

    }


    // ========================================================
    // IMAGE GENERATION MODAL
    // ========================================================

    function openImageModal() {

        document
            .getElementById(
                "imageModal"
            )
            .classList.add(
                "active"
            );

    }


    function closeImageModal() {

        document
            .getElementById(
                "imageModal"
            )
            .classList.remove(
                "active"
            );

    }


    // ========================================================
    // GENERATE IMAGE
    // ========================================================

    async function generateImage() {

        const prompt =
            document
            .getElementById(
                "imagePrompt"
            )
            .value
            .trim();


        if (!prompt) {

            alert(
                "Décris l'image à générer."
            );

            return;

        }


        const button =
            document.getElementById(
                "generateButton"
            );


        const preview =
            document.getElementById(
                "generatedPreview"
            );


        button.disabled =
            true;


        button.textContent =
            "⏳ Génération en cours...";


        preview.style.display =
            "none";


        try {

            let referenceImage =
                null;


            const referenceFile =
                document
                .getElementById(
                    "referenceInput"
                )
                .files[0];


            if (referenceFile) {

                if (
                    referenceFile.size >
                    15 * 1024 * 1024
                ) {

                    throw new Error(
                        "L'image de référence est trop volumineuse."
                    );

                }


                referenceImage =
                    await fileToBase64(
                        referenceFile
                    );

            }


            const response =
                await fetch(
                    "/api/generate-image",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                prompt:
                                    prompt,

                                aspect_ratio:
                                    document
                                    .getElementById(
                                        "imageRatio"
                                    )
                                    .value,

                                resolution:
                                    document
                                    .getElementById(
                                        "imageResolution"
                                    )
                                    .value,

                                quality:
                                    document
                                    .getElementById(
                                        "imageQuality"
                                    )
                                    .value,

                                n:
                                    Number(
                                        document
                                        .getElementById(
                                            "imageCount"
                                        )
                                        .value
                                    ),

                                output_format:
                                    "png",

                                reference_image:
                                    referenceImage

                            })

                    }
                );


            const data =
                await response.json()
                    .catch(
                        () => ({})
                    );


            if (!response.ok) {

                throw new Error(

                    data.error ||
                    "Erreur pendant la génération."

                );

            }


            if (
                !Array.isArray(
                    data.images
                ) ||
                !data.images.length
            ) {

                throw new Error(
                    "Aucune image n'a été reçue."
                );

            }


            closeImageModal();


            addMessage(
                "user",
                "🎨 " + prompt
            );


            for (
                const image
                of data.images
            ) {

                if (
                    image &&
                    image.data
                ) {

                    addGeneratedImage(
                        image.data
                    );

                }

            }


            setStatus(
                true
            );

        } catch (error) {

            alert(

                "❌ " +
                (
                    error.message ||
                    "Impossible de générer l'image."
                )

            );

        } finally {

            button.disabled =
                false;


            button.textContent =
                "✨ Générer l'image";

        }

    }


    // ========================================================
    // SET MESSAGE
    // ========================================================

    function setMessage(
        text
    ) {

        messageInput.value =
            text;


        resizeTextarea();


        messageInput.focus();

    }


    // ========================================================
    // CLEAR CONVERSATION
    // ========================================================

    function clearConversation() {

        if (
            !confirm(
                "Effacer cette conversation ?"
            )
        ) {

            return;

        }


        history =
            [];


        localStorage.removeItem(
            "messie_ia_history"
        );


        messages.innerHTML =
            "";


        messages.appendChild(
            welcome
        );


        welcome.style.display =
            "block";


        removeReference();

    }


    // ========================================================
    // TEXTAREA
    // ========================================================

    messageInput.addEventListener(
        "input",
        resizeTextarea
    );


    function resizeTextarea() {

        messageInput.style.height =
            "auto";


        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                150
            ) + "px";

    }


    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // ========================================================
    // STATUS
    // ========================================================

    function setStatus(
        online
    ) {

        const dot =
            document.getElementById(
                "statusDot"
            );


        const text =
            document.getElementById(
                "statusText"
            );


        if (online) {

            text.textContent =
                "En ligne";


            dot.style.background =
                "#22c55e";


            dot.style.boxShadow =
                "0 0 10px #22c55e";

        } else {

            text.textContent =
                "Erreur";


            dot.style.background =
                "#ef4444";


            dot.style.boxShadow =
                "0 0 10px #ef4444";

        }

    }


    // ========================================================
    // HEALTH
    // ========================================================

    async function checkHealth() {

        try {

            const response =
                await fetch(
                    "/health"
                );


            if (!response.ok) {

                throw new Error();

            }


            const data =
                await response.json();


            setStatus(
                data.status === "ok" &&
                data.openrouter === true
            );

        } catch (error) {

            setStatus(
                false
            );

        }

    }


    // ========================================================
    // MODAL CLICK OUTSIDE
    // ========================================================

    document
        .getElementById(
            "imageModal"
        )
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target === this
                ) {

                    closeImageModal();

                }

            }
        );


    // ========================================================
    // START
    // ========================================================

    checkHealth();

    messageInput.focus();

</script>
