<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messie IA</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #0b0b0f;
            color: #ffffff;

            min-height: 100vh;
        }


        /* =====================================================
           APPLICATION
        ===================================================== */

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            background: #111116;

            border-bottom:
                1px solid #292932;

            position: sticky;
            top: 0;
            z-index: 100;
        }


        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .logo-icon {
            width: 38px;
            height: 38px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #ec4899
                );

            font-weight: 800;
            font-size: 18px;
        }


        .logo-text {
            font-size: 18px;
            font-weight: 700;
        }


        .status {
            font-size: 12px;
            color: #8dffbe;

            display: flex;
            align-items: center;
            gap: 6px;
        }


        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #38e98a;
        }


        /* =====================================================
           CHAT
        ===================================================== */

        #messages {
            flex: 1;

            width: 100%;
            max-width: 900px;

            margin: 0 auto;

            padding: 25px 16px 150px;

            overflow-y: auto;
        }


        .welcome {
            text-align: center;

            padding:
                60px
                15px
                30px;
        }


        .welcome-icon {
            width: 70px;
            height: 70px;

            margin: auto;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #db2777
                );

            font-size: 30px;

            margin-bottom: 20px;
        }


        .welcome h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }


        .welcome p {
            color: #9999a5;
            font-size: 15px;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {
            display: flex;

            margin-bottom: 20px;

            animation:
                messageIn
                .2s
                ease;
        }


        @keyframes messageIn {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        .message.user {
            justify-content: flex-end;
        }


        .message-content {
            max-width: 82%;

            padding: 13px 16px;

            border-radius: 17px;

            line-height: 1.55;

            white-space: pre-wrap;

            word-wrap: break-word;
        }


        .message.assistant
        .message-content {

            background: #17171e;

            border:
                1px solid #292932;
        }


        .message.user
        .message-content {

            background:
                linear-gradient(
                    135deg,
                    #6d28d9,
                    #9333ea
                );
        }


        /* =====================================================
           IMAGE
        ===================================================== */

        .generated-image {
            width: 100%;
            max-width: 600px;

            border-radius: 16px;

            display: block;

            margin-top: 10px;

            border:
                1px solid #30303a;
        }


        .image-container {
            margin-top: 12px;
        }

            margin-top: 10px;
