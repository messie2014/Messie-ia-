<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messie IA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f5f7fb;
            color: #202124;
        }

        body {
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 65px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #e5e7eb;
            background: white;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 18px;
        }

        .brand-text span {
            font-size: 12px;
            color: #6b7280;
        }

        .clear-button {
            border: 0;
            background: #f3f4f6;
            color: #374151;
            padding: 9px 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        .clear-button:hover {
            background: #e5e7eb;
        }

        /* =========================
           CHAT
        ========================= */

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .welcome {
            max-width: 650px;
            margin: 70px auto;
            text-align: center;
        }

        .welcome-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .welcome h2 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .welcome p {
            margin: 0;
            color: #6b7280;
            line-height: 1.6;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 78%;
            padding: 12px 15px;
            border-radius: 17px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user .bubble {
            background: #111827;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .assistant .bubble {
            background: #f1f3f5;
            color: #202124;
            border-bottom-left-radius: 5px;
        }

        .error .bubble {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            display: inline-flex;
            gap: 5px;
            align-items: center;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #6b7280;
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: .2s;
        }

        .dot:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: .3;
            }

            40% {
                opacity: 1;
            }
        }

        /* =========================
           IMAGE PREVIEW
        ========================= */

        #imagePreviewContainer {
            display: none;
            padding: 10px 16px 0;
        }

        .preview-box {
            position: relative;
            display: inline-block;
        }

        #imagePreview {
            max-width: 180px;
            max-height: 140px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        #removeImage {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 25px;
            height: 25px;
            border: 0;
            border-radius: 50%;
            background: #111827;
            color: white;
            cursor: pointer;
        }

        /* =========================
           INPUT
        ========================= */

        .composer {
            padding: 12px 15px 15px;
            border-top: 1px solid #e5e7eb;
            background: white;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            border: 1px solid #d1d5db;
            border-radius: 18px;
            padding: 7px;
            background: #fff;
        }

        textarea {
            flex: 1;
            resize: none;
            border: 0;
            outline: none;
            min-height: 42px;
            max-height: 140px;
            padding: 10px;
            font-size: 15px;
            font-family: inherit;
        }

        .icon-button,
        .send-button {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-button {
            background: #f3f4f6;
            font-size: 19px;
        }

        .icon-button:hover {
            background: #e5e7eb;
        }

        .send-button {
            background: #111827;
            color: white;
            font-size: 18px;
        }

        .send-button:hover {
            background: #000;
        }

        .send-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none;
        }

        .hint {
            text-align: center;
            margin-top: 8px;
            font-size: 11px;
            color: #9ca3af;
        }

        @media (max-width: 600px) {

            header {
                height: 60px;
            }

            #messages {
                padding: 14px;
            }

            .bubble {
                max-width: 88%;
            }

            .welcome {
                margin: 50px auto;
            }

            .welcome h2 {
                font-size: 24px;
            }

            .composer {
                padding: 9px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="brand">

            <div class="logo">
                M
            </div>

            <div class="brand-text">

                <h1>Messie IA</h1>

                <span>
                    Votre assistant intelligent
                </span>

            </div>

        </div>

        <button
            class="clear-button"
            id="clearButton"
            type="button"
        >
            Nouvelle discussion
        </button>

    </header>


    <!-- =========================
         MESSAGES
    ========================== -->

    <main id="messages">

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-logo">
                M
            </div>

            <h2>
                Bonjour 👋
            </h2>

            <p>
                Je suis Messie IA.
                Pose-moi une question, demande-moi
                de t'aider à écrire, apprendre,
                réfléchir ou analyser une image.
            </p>

        </div>

    </main>


    <!-- =========================
         APERÇU IMAGE
    ========================== -->

    <div id="imagePreviewContainer">

        <div class="preview-box">

            <img
                id="imagePreview"
                alt="Image sélectionnée"
            >

            <button
                id="removeImage"
                type="button"
            >
                ×
            </button>

        </div>

    </div>


    <!-- =========================
         COMPOSER
    ========================== -->

    <section class="composer">

        <div class="input-row">

            <label
                class="icon-button"
                title="Ajouter une image"
            >

                📎

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >

            </label>


            <textarea
                id="messageInput"
                placeholder="Écris ton message..."
                rows="1"
            ></textarea>


            <button
                class="send-button"
                id="sendButton"
                type="button"
                title="Envoyer"
            >
                ➤
            </button>

        </div>

        <div class="hint">
            Messie IA peut parfois faire des erreurs.
        </div>

    </section>

</div>


<script>

    // ========================================================
    // VARIABLES
    // ========================================================

    const messagesContainer =
        document.getElementById("messages");

    const welcome =
        document.getElementById("welcome");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const clearButton =
        document.getElementById("clearButton");

    const imageInput =
        document.getElementById("imageInput");

    const imagePreview =
        document.getElementById("imagePreview");

    const imagePreviewContainer =
        document.getElementById(
            "imagePreviewContainer"
        );

    const removeImage =
        document.getElementById(
            "removeImage"
        );


    let history = [];

    let selectedImage = null;

    let loading = false;


    // ========================================================
    // AJOUTER UN MESSAGE
    // ========================================================

    function addMessage(
        role,
        content,
        isError = false
    ) {

        if (welcome) {
            welcome.style.display = "none";
        }


        const wrapper =
            document.createElement("div");


        wrapper.className =
            "message " +
            role +
            (isError ? " error" : "");


        const bubble =
            document.createElement("div");


        bubble.className =
            "bubble";


        bubble.textContent =
            content;


        wrapper.appendChild(
            bubble
        );


        messagesContainer.appendChild(
            wrapper
        );


        messagesContainer.scrollTop =
            messagesContainer.scrollHeight;


        return wrapper;
    }


    // ========================================================
    // INDICATEUR DE CHARGEMENT
    // ========================================================

    function addLoading() {

        if (welcome) {
            welcome.style.display = "none";
        }


        const wrapper =
            document.createElement("div");


        wrapper.className =
            "message assistant";


        wrapper.id =
            "loadingMessage";


        const bubble =
            document.createElement("div");


        bubble.className =
            "bubble";


        bubble.innerHTML = `
            <span class="loading">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </span>
        `;


        wrapper.appendChild(
            bubble
        );


        messagesContainer.appendChild(
            wrapper
        );


        messagesContainer.scrollTop =
            messagesContainer.scrollHeight;

    }


    function removeLoading() {

        const element =
            document.getElementById(
                "loadingMessage"
            );


        if (element) {
            element.remove();
        }

    }


    // ========================================================
    // ENVOYER MESSAGE
    // ========================================================

    async function sendMessage() {

        if (loading) {
            return;
        }


        const text =
            messageInput.value.trim();


        // ----------------------------------------------------
        // IMAGE
        // ----------------------------------------------------

        if (selectedImage) {

            if (!text) {

                await analyzeImage();

                return;

            }

        }


        if (!text) {
            return;
        }


        loading = true;

        sendButton.disabled = true;


        addMessage(
            "user",
            text
        );


        messageInput.value = "";

        autoResize();


        addLoading();


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                message:
                                    text,

                                history:
                                    history

                            })

                    }
                );


            let data;


            try {

                data =
                    await response.json();

            } catch {

                throw new Error(
                    "Le serveur a renvoyé une réponse invalide."
                );

            }


            removeLoading();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Impossible de contacter Messie IA."
                );

            }


            if (!data.response) {

                throw new Error(
                    "Messie IA n'a pas renvoyé de réponse."
                );

            }


            addMessage(
                "assistant",
                data.response
            );


            history.push({

                role:
                    "user",

                content:
                    text

            });


            history.push({

                role:
                    "assistant",

                content:
                    data.response

            });


        } catch (error) {

            removeLoading();


            addMessage(
                "assistant",
                error.message ||
                "Impossible de contacter Messie IA.",
                true
            );

        } finally {

            loading = false;

            sendButton.disabled =
                false;

        }

    }


    // ========================================================
    // ANALYSER UNE IMAGE
    // ========================================================

    async function analyzeImage() {

        if (!selectedImage) {
            return;
        }


        loading = true;

        sendButton.disabled = true;


        const prompt =
            messageInput.value.trim() ||
            "Décris et analyse cette image en détail.";


        addMessage(
            "user",
            prompt
        );


        messageInput.value = "";

        autoResize();


        addLoading();


        try {

            const response =
                await fetch(
                    "/api/analyze-image",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                image:
                                    selectedImage,

                                prompt:
                                    prompt

                            })

                    }
                );


            const data =
                await response.json();


            removeLoading();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Impossible d'analyser l'image."
                );

            }


            addMessage(
                "assistant",
                data.response ||
                "Je n'ai pas pu analyser cette image."
            );


        } catch (error) {

            removeLoading();


            addMessage(
                "assistant",
                error.message ||
                "Impossible d'analyser l'image.",
                true
            );

        } finally {

            loading = false;

            sendButton.disabled =
                false;

        }

    }


    // ========================================================
    // IMAGE SÉLECTIONNÉE
    // ========================================================

    imageInput.addEventListener(
        "change",
        function () {

            const file =
                this.files[0];


            if (!file) {
                return;
            }


            if (!file.type.startsWith("image/")) {

                alert(
                    "Veuillez sélectionner une image."
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    selectedImage =
                        event.target.result;


                    imagePreview.src =
                        selectedImage;


                    imagePreviewContainer.style.display =
                        "block";

                };


            reader.readAsDataURL(
                file
            );

        }
    );


    // ========================================================
    // SUPPRIMER IMAGE
    // ========================================================

    removeImage.addEventListener(
        "click",
        function () {

            selectedImage = null;

            imageInput.value = "";

            imagePreview.src = "";

            imagePreviewContainer.style.display =
                "none";

        }
    );


    // ========================================================
    // NOUVELLE DISCUSSION
    // ========================================================

    clearButton.addEventListener(
        "click",
        function () {

            history = [];

            selectedImage = null;

            imageInput.value = "";

            imagePreview.src = "";

            imagePreviewContainer.style.display =
                "none";


            messagesContainer.innerHTML = `
                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        M
                    </div>

                    <h2>
                        Bonjour 👋
                    </h2>

                    <p>
                        Je suis Messie IA.
                        Pose-moi une question,
                        demande-moi de t'aider,
                        d'apprendre ou d'analyser
                        une image.
                    </p>

                </div>
            `;

        }
    );


    // ========================================================
    // ENTRÉE CLAVIER
    // ========================================================

    messageInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // ========================================================
    // REDIMENSIONNEMENT TEXTAREA
    // ========================================================

    function autoResize() {

        messageInput.style.height =
            "auto";


        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                140
            ) + "px";

    }


    messageInput.addEventListener(
        "input",
        autoResize
    );


    // ========================================================
    // BOUTON ENVOYER
    // ========================================================

    sendButton.addEventListener(
        "click",
        sendMessage
    );

</script>

</body>
</html>
