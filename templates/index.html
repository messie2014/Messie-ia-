<!DOCTYPE html><html lang="fr">
<head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Messie IA</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
    }

    button,
    input,
    textarea {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    .app {
        width: 100%;
        height: 100vh;
        display: flex;
    }

    /* ==================================================
       SIDEBAR
    ================================================== */

    .sidebar {
        width: 280px;
        height: 100vh;
        flex-shrink: 0;
        background: #111827;
        color: white;
        padding: 18px;
        display: flex;
        flex-direction: column;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 18px;
    }

    .new-chat {
        border: 0;
        border-radius: 12px;
        padding: 12px;
        background: #2563eb;
        color: white;
        margin-bottom: 18px;
    }

    .new-chat:hover {
        background: #1d4ed8;
    }

    .conversation-title {
        font-size: 13px;
        opacity: .7;
        margin-bottom: 8px;
    }

    .back-button {
        border: 0;
        background: transparent;
        color: white;
        text-align: left;
        padding: 7px 0;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .back-button:hover {
        opacity: .8;
    }

    #conversationList {
        overflow-y: auto;
        flex: 1;
        min-height: 0;
    }

    .conversation {
        width: 100%;
        border: 0;
        background: transparent;
        color: white;
        text-align: left;
        padding: 10px;
        border-radius: 9px;
        margin-bottom: 5px;
    }

    .conversation:hover {
        background: #1f2937;
    }

    .account-area {
        border-top: 1px solid #374151;
        padding-top: 15px;
        margin-top: 15px;
        flex-shrink: 0;
    }

    .account-name {
        font-weight: bold;
        margin-bottom: 4px;
    }

    .account-email {
        font-size: 12px;
        opacity: .7;
        margin-bottom: 10px;
        word-break: break-word;
    }

    .account-button {
        width: 100%;
        border: 1px solid #4b5563;
        background: transparent;
        color: white;
        border-radius: 9px;
        padding: 9px;
    }

    /* ==================================================
       MAIN
    ================================================== */

    .main {
        flex: 1;
        min-width: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .topbar {
        height: 64px;
        flex-shrink: 0;
        background: white;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
    }

    .topbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .topbar-title {
        font-weight: bold;
    }

    .mobile-menu {
        display: none;
        border: 0;
        background: transparent;
        font-size: 24px;
        padding: 5px;
    }

    /* ==================================================
       CHAT
    ================================================== */

    #messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 25px;
    }

    .welcome {
        max-width: 700px;
        margin: 60px auto;
        text-align: center;
    }

    .welcome h1 {
        font-size: 34px;
        margin-bottom: 10px;
    }

    .welcome p {
        color: #6b7280;
    }

    .message {
        max-width: 850px;
        margin: 0 auto 18px auto;
        display: flex;
    }

    .message.user {
        justify-content: flex-end;
    }

    .bubble {
        max-width: 80%;
        padding: 13px 16px;
        border-radius: 17px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.5;
    }

    .message.user .bubble {
        background: #2563eb;
        color: white;
        border-bottom-right-radius: 5px;
    }

    .message.assistant .bubble {
        background: white;
        border: 1px solid #e5e7eb;
        border-bottom-left-radius: 5px;
    }

    .image-preview {
        display: block;
        max-width: 280px;
        max-height: 280px;
        border-radius: 12px;
        margin-bottom: 10px;
    }

    /* ==================================================
       INPUT
    ================================================== */

    .composer {
        flex-shrink: 0;
        background: white;
        border-top: 1px solid #e5e7eb;
        padding: 14px;
    }

    .composer-inner {
        max-width: 900px;
        margin: auto;
    }

    #prompt {
        width: 100%;
        min-height: 52px;
        max-height: 180px;
        resize: vertical;
        border: 1px solid #d1d5db;
        border-radius: 14px;
        padding: 14px;
        outline: none;
    }

    #prompt:focus {
        border-color: #2563eb;
    }

    .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 9px;
    }

    .tool-button {
        border: 1px solid #d1d5db;
        background: white;
        border-radius: 10px;
        padding: 9px 12px;
    }

    .tool-button:hover {
        background: #f3f4f6;
    }

    .tool-button:disabled,
    .send-button:disabled {
        opacity: .6;
        cursor: not-allowed;
    }

    .send-button {
        margin-left: auto;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        padding: 10px 17px;
    }

    .send-button:hover {
        background: #1d4ed8;
    }

    .recording {
        background: #dc2626 !important;
        color: white;
    }

    #fileInput {
        display: none;
    }

    .status {
        font-size: 12px;
        color: #6b7280;
        margin-top: 7px;
        min-height: 16px;
    }

    /* ==================================================
       MODAL
    ================================================== */

    .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 100;
    }

    .modal.show {
        display: flex;
    }

    .modal-card {
        width: 100%;
        max-width: 430px;
        background: white;
        border-radius: 18px;
        padding: 22px;
    }

    .modal-card h2 {
        margin-top: 0;
    }

    .modal-card input {
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
    }

    .modal-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
    }

    .modal-actions button {
        flex: 1;
        padding: 11px;
        border-radius: 10px;
        border: 0;
    }

    .primary {
        background: #2563eb;
        color: white;
    }

    .secondary {
        background: #e5e7eb;
    }

    .modal-error {
        color: #dc2626;
        font-size: 13px;
        margin-bottom: 10px;
    }

    .hidden {
        display: none !important;
    }

    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 760px) {

        html,
        body {
            overflow: hidden;
        }

        .sidebar {
            position: fixed;
            z-index: 50;
            left: -290px;
            top: 0;
            bottom: 0;
            transition: left .2s ease;
        }

        .sidebar.open {
            left: 0;
        }

        .mobile-menu {
            display: block;
        }

        #messages {
            padding: 14px;
        }

        .bubble {
            max-width: 90%;
        }

        .welcome {
            margin: 45px auto;
        }

        .welcome h1 {
            font-size: 28px;
        }

        .toolbar {
            flex-wrap: wrap;
        }

        .send-button {
            margin-left: 0;
        }

        .tool-button,
        .send-button {
            padding: 9px 10px;
        }
    }

</style>

</head><body><div class="app"><!-- ====================================================
     SIDEBAR
===================================================== -->

<aside
    id="sidebar"
    class="sidebar"
>

    <div class="logo">
        🤖 Messie IA
    </div>

    <button
        id="newChatButton"
        class="new-chat"
        type="button"
    >
        ＋ Nouvelle conversation
    </button>

    <div class="conversation-title">
        Mes conversations
    </div>

    <button
        id="backToChatButton"
        class="back-button"
        type="button"
    >
        ← Retour à la conversation
    </button>

    <div id="conversationList"></div>

    <div class="account-area">

        <div
            id="accountName"
            class="account-name"
        >
            Invité
        </div>

        <div
            id="accountEmail"
            class="account-email"
        >
            Connecte-toi pour sauvegarder tes conversations.
        </div>

        <button
            id="accountButton"
            class="account-button"
            type="button"
        >
            Se connecter
        </button>

    </div>

</aside>


<!-- ====================================================
     MAIN
===================================================== -->

<main class="main">

    <header class="topbar">

        <div class="topbar-left">

            <button
                id="mobileMenu"
                class="mobile-menu"
                type="button"
                aria-label="Menu"
            >
                ☰
            </button>

            <span class="topbar-title">
                Messie IA
            </span>

        </div>

        <div id="connectionStatus">
            🟢
        </div>

    </header>


    <!-- =================================================
         MESSAGES
    ================================================== -->

    <section id="messages">

        <div
            id="welcome"
            class="welcome"
        >

            <h1>
                Bonjour 👋
            </h1>

            <p>
                Je suis Messie IA. Pose-moi une question,
                envoie-moi une image ou utilise ta voix.
            </p>

        </div>

    </section>


    <!-- =================================================
         COMPOSER
    ================================================== -->

    <section class="composer">

        <div class="composer-inner">

            <textarea
                id="prompt"
                placeholder="Écris ton message..."
            ></textarea>


            <div class="toolbar">

                <label
                    for="fileInput"
                    class="tool-button"
                >
                    🖼️ Image
                </label>

                <input
                    id="fileInput"
                    type="file"
                    accept="image/*"
                >


                <button
                    id="voiceButton"
                    class="tool-button"
                    type="button"
                >
                    🎙️ Voix
                </button>


                <button
                    id="generateButton"
                    class="tool-button"
                    type="button"
                >
                    🎨 Image
                </button>


                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                >
                    Envoyer
                </button>

            </div>


            <div
                id="status"
                class="status"
            ></div>

        </div>

    </section>

</main>

</div><!-- ========================================================
     AUTH MODAL
========================================================= --><div
    id="authModal"
    class="modal"
><div class="modal-card">

    <h2 id="authTitle">
        Connexion
    </h2>

    <div
        id="authError"
        class="modal-error"
    ></div>


    <div
        id="nameContainer"
        class="hidden"
    >

        <input
            id="nameInput"
            type="text"
            placeholder="Ton nom"
            autocomplete="name"
        >

    </div>


    <input
        id="emailInput"
        type="email"
        placeholder="Adresse email"
        autocomplete="email"
    >


    <input
        id="passwordInput"
        type="password"
        placeholder="Mot de passe"
        autocomplete="current-password"
    >


    <div class="modal-actions">

        <button
            id="authSubmit"
            class="primary"
            type="button"
        >
            Se connecter
        </button>

        <button
            id="authClose"
            class="secondary"
            type="button"
        >
            Fermer
        </button>

    </div>


    <p
        id="authSwitch"
        style="text-align:center;cursor:pointer;color:#2563eb;margin-top:15px;"
    >
        Créer un compte
    </p>

</div>

</div><script>

    // ========================================================
    // ÉTAT
    // ========================================================

    let currentConversationId = null;

    let localHistory = [];

    let authMode = "login";

    let selectedImage = null;

    let recognition = null;

    let isRecording = false;

    let voiceTextBeforeRecording = "";


    // ========================================================
    // ÉLÉMENTS
    // ========================================================

    const messagesElement =
        document.getElementById("messages");

    const welcomeElement =
        document.getElementById("welcome");

    const promptElement =
        document.getElementById("prompt");

    const sendButton =
        document.getElementById("sendButton");

    const statusElement =
        document.getElementById("status");

    const fileInput =
        document.getElementById("fileInput");

    const voiceButton =
        document.getElementById("voiceButton");

    const generateButton =
        document.getElementById("generateButton");

    const conversationList =
        document.getElementById("conversationList");

    const accountButton =
        document.getElementById("accountButton");

    const authModal =
        document.getElementById("authModal");

    const authTitle =
        document.getElementById("authTitle");

    const authError =
        document.getElementById("authError");

    const nameContainer =
        document.getElementById("nameContainer");

    const nameInput =
        document.getElementById("nameInput");

    const emailInput =
        document.getElementById("emailInput");

    const passwordInput =
        document.getElementById("passwordInput");

    const authSubmit =
        document.getElementById("authSubmit");

    const authClose =
        document.getElementById("authClose");

    const authSwitch =
        document.getElementById("authSwitch");

    const accountName =
        document.getElementById("accountName");

    const accountEmail =
        document.getElementById("accountEmail");

    const mobileMenu =
        document.getElementById("mobileMenu");

    const sidebar =
        document.getElementById("sidebar");

    const backToChatButton =
        document.getElementById("backToChatButton");


    // ========================================================
    // OUTILS
    // ========================================================

    function setStatus(text) {

        statusElement.textContent =
            text || "";

    }


    // ========================================================
    // AFFICHER MESSAGE
    // ========================================================

    function addMessage(
        role,
        content,
        image = null
    ) {

        if (welcomeElement) {

            welcomeElement.style.display =
                "none";

        }


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message " + role;


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        if (image) {

            const img =
                document.createElement("img");

            img.src =
                image;

            img.className =
                "image-preview";

            bubble.appendChild(
                img
            );


            if (content) {

                const text =
                    document.createElement("div");

                text.textContent =
                    content;

                bubble.appendChild(
                    text
                );

            }

        } else {

            bubble.textContent =
                content;

        }


        wrapper.appendChild(
            bubble
        );


        messagesElement.appendChild(
            wrapper
        );


        messagesElement.scrollTop =
            messagesElement.scrollHeight;

    }


    // ========================================================
    // NOUVELLE CONVERSATION
    // ========================================================

    async function newConversation() {

        currentConversationId =
            null;

        localHistory =
            [];

        messagesElement.innerHTML =
            "";

        messagesElement.appendChild(
            welcomeElement
        );

        welcomeElement.style.display =
            "block";


        sidebar.classList.remove(
            "open"
        );


        try {

            const response =
                await fetch(
                    "/api/conversations",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            title:
                                "Nouvelle conversation"
                        })
                    }
                );


            if (response.status === 401) {

                setStatus(
                    "Connecte-toi pour sauvegarder les conversations."
                );

                return;

            }


            const data =
                await response.json();


            if (data.success) {

                currentConversationId =
                    data.conversation.id;

                await loadConversations();

            }

        } catch (error) {

            console.log(
                "Nouvelle conversation:",
                error
            );

        }

    }


    // ========================================================
    // CHARGER CONVERSATIONS
    // ========================================================

    async function loadConversations() {

        try {

            const response =
                await fetch(
                    "/api/conversations"
                );


            if (response.status === 401) {

                conversationList.innerHTML =
                    "<div style='opacity:.6;font-size:13px;'>Connecte-toi pour voir tes conversations.</div>";

                return;

            }


            const data =
                await response.json();


            conversationList.innerHTML =
                "";


            if (
                !data.success ||
                !data.conversations ||
                !data.conversations.length
            ) {

                conversationList.innerHTML =
                    "<div style='opacity:.6;font-size:13px;'>Aucune conversation.</div>";

                return;

            }


            data.conversations.forEach(
                conversation => {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.className =
                        "conversation";

                    button.type =
                        "button";

                    button.textContent =
                        "💬 " +
                        conversation.title;

                    button.addEventListener(
                        "click",
                        function() {

                            loadConversation(
                                conversation.id
                            );

                        }
                    );

                    conversationList.appendChild(
                        button
                    );

                }
            );


        } catch (error) {

            console.log(
                "Chargement conversations:",
                error
            );

        }

    }


    // ========================================================
    // CHARGER UNE CONVERSATION
    // ========================================================

    async function loadConversation(
        id
    ) {

        try {

            const response =
                await fetch(
                    "/api/conversations/" + id
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.error ||
                    "Conversation introuvable."
                );

            }


            currentConversationId =
                id;


            localHistory =
                [];


            messagesElement.innerHTML =
                "";


            const conversation =
                data.conversation;


            if (
                !conversation.messages ||
                !conversation.messages.length
            ) {

                messagesElement.appendChild(
                    welcomeElement
                );

                welcomeElement.style.display =
                    "block";

            } else {

                conversation.messages.forEach(
                    message => {

                        addMessage(
                            message.role,
                            message.content
                        );


                        localHistory.push({

                            role:
                                message.role,

                            content:
                                message.content

                        });

                    }
                );

            }


            sidebar.classList.remove(
                "open"
            );


        } catch (error) {

            console.log(
                "Chargement conversation:",
                error
            );

            addMessage(
                "assistant",
                "❌ " + error.message
            );

        }

    }


    // ========================================================
    // ENVOYER MESSAGE
    // ========================================================

    async function sendMessage() {

        const message =
            promptElement.value.trim();


        if (!message) {

            return;

        }


        promptElement.value =
            "";


        addMessage(
            "user",
            message
        );


        localHistory.push({

            role:
                "user",

            content:
                message

        });


        sendButton.disabled =
            true;


        setStatus(
            "Messie IA réfléchit..."
        );


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({

                            message:
                                message,

                            history:
                                localHistory.slice(
                                    -20
                                ),

                            conversation_id:
                                currentConversationId

                        })
                    }
                );


            const responseText =
                await response.text();


            let data;


            try {

                data =
                    JSON.parse(
                        responseText
                    );

            } catch (jsonError) {

                throw new Error(
                    "Le serveur a renvoyé une réponse inattendue."
                );

            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Erreur du serveur."
                );

            }


            if (!data.success) {

                throw new Error(
                    data.error ||
                    "Messie IA n'a pas pu répondre."
                );

            }


            const answer =
                data.response;


            currentConversationId =
                data.conversation_id ||
                currentConversationId;


            addMessage(
                "assistant",
                answer
            );


            localHistory.push({

                role:
                    "assistant",

                content:
                    answer

            });


            await loadConversations();


            setStatus(
                ""
            );


        } catch (error) {

            console.error(
                "Erreur chat:",
                error
            );


            addMessage(
                "assistant",
                "❌ " + error.message
            );


            setStatus(
                ""
            );

        }


        sendButton.disabled =
            false;

    }


    // ========================================================
    // ANALYSE D'IMAGE
    // ========================================================

    fileInput.addEventListener(
        "change",
        async function() {

            const file =
                this.files[0];


            if (!file) {

                return;

            }


            if (!file.type.startsWith("image/")) {

                addMessage(
                    "assistant",
                    "❌ Veuillez sélectionner une image."
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                async function(event) {

                    selectedImage =
                        event.target.result;


                    addMessage(
                        "user",
                        "Analyse cette image.",
                        selectedImage
                    );


                    setStatus(
                        "Analyse de l'image..."
                    );


                    try {

                        const response =
                            await fetch(
                                "/api/analyze-image",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },
                                    body: JSON.stringify({

                                        image:
                                            selectedImage,

                                        prompt:
                                            "Analyse cette image et explique ce que tu vois de manière détaillée."

                                    })
                                }
                            );


                        const responseText =
                            await response.text();


                        let data;


                        try {

                            data =
                                JSON.parse(
                                    responseText
                                );

                        } catch (jsonError) {

                            throw new Error(
                                "Le serveur a renvoyé une réponse inattendue."
                            );

                        }


                        if (!response.ok) {

                            throw new Error(
                                data.error ||
                                "Erreur d'analyse."
                            );

                        }


                        if (!data.success) {

                            throw new Error(
                                data.error ||
                                "Impossible d'analyser l'image."
                            );

                        }


                        addMessage(
                            "assistant",
                            data.response
                        );


                    } catch (error) {

                        console.error(
                            "Erreur image:",
                            error
                        );


                        addMessage(
                            "assistant",
                            "❌ " +
                            error.message
                        );

                    }


                    setStatus(
                        ""
                    );


                    fileInput.value =
                        "";

                };


            reader.readAsDataURL(
                file
            );

        }
    );


    // ========================================================
    // GÉNÉRATION IMAGE
    // ========================================================

    generateButton.addEventListener(
        "click",
        async function() {

            const prompt =
                promptElement.value.trim();


            if (!prompt) {

                alert(
                    "Décris l'image que tu veux créer."
                );

                return;

            }


            setStatus(
                "Génération de l'image..."
            );


            generateButton.disabled =
                true;


            try {

                const response =
                    await fetch(
                        "/api/generate-image",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify({

                                prompt:
                                    prompt,

                                aspect_ratio:
                                    "1:1",

                                resolution:
                                    "1K",

                                quality:
                                    "auto",

                                output_format:
                                    "png"

                            })
                        }
                    );


                const responseText =
                    await response.text();


                let data;


                try {

                    data =
                        JSON.parse(
                            responseText
                        );

                } catch (jsonError) {

                    console.error(
                        "Réponse non JSON:",
                        responseText
                    );

                    throw new Error(
                        "Le serveur a renvoyé une réponse inattendue."
                    );

                }


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Erreur de génération."
                    );

                }


                if (
                    !data.success ||
                    !data.images ||
                    !data.images.length
                ) {

                    throw new Error(
                        data.error ||
                        "Aucune image générée."
                    );

                }


                data.images.forEach(
                    image => {

                        addMessage(
                            "assistant",
                            "Voici ton image :",
                            image.data
                        );

                    }
                );


                promptElement.value =
                    "";


            } catch (error) {

                console.error(
                    "Erreur génération image:",
                    error
                );


                addMessage(
                    "assistant",
                    "❌ " +
                    error.message
                );

            }


            generateButton.disabled =
                false;


            setStatus(
                ""
            );

        }
    );


    // ========================================================
    // 🎙️ VOCAL → TEXTE
    // ========================================================

    function setupVoice() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            voiceButton.addEventListener(
                "click",
                function() {

                    alert(
                        "La reconnaissance vocale n'est pas disponible dans ce navigateur. Essaie Google Chrome sur Android."
                    );

                }
            );

            return;

        }


        recognition =
            new SpeechRecognition();


        recognition.lang =
            "fr-FR";


        recognition.continuous =
            true;


        recognition.interimResults =
            true;


        recognition.onstart =
            function() {

                isRecording =
                    true;


                voiceTextBeforeRecording =
                    promptElement.value.trim();


                voiceButton.classList.add(
                    "recording"
                );


                voiceButton.textContent =
                    "⏹️ Arrêter";


                setStatus(
                    "🎙️ Je t'écoute..."
                );

            };


        recognition.onresult =
            function(event) {

                let transcript =
                    "";


                for (
                    let i = event.resultIndex;
                    i < event.results.length;
                    i++
                ) {

                    transcript +=
                        event.results[i][0].transcript;

                }


                transcript =
                    transcript.trim();


                if (!transcript) {

                    return;

                }


                if (
                    voiceTextBeforeRecording
                ) {

                    promptElement.value =
                        voiceTextBeforeRecording +
                        " " +
                        transcript;

                } else {

                    promptElement.value =
                        transcript;

                }

            };


        recognition.onerror =
            function(event) {

                console.log(
                    "Erreur reconnaissance vocale:",
                    event.error
                );


                if (
                    event.error ===
                    "not-allowed"
                ) {

                    setStatus(
                        "❌ Autorise l'accès au microphone dans ton navigateur."
                    );

                } else if (
                    event.error ===
                    "no-speech"
                ) {

                    setStatus(
                        "Aucune parole détectée."
                    );

                } else {

                    setStatus(
                        "❌ Erreur de reconnaissance vocale."
                    );

                }

            };


        recognition.onend =
            function() {

                isRecording =
                    false;


                voiceButton.classList.remove(
                    "recording"
                );


                voiceButton.textContent =
                    "🎙️ Voix";


                setStatus(
                    ""
                );

            };


        voiceButton.addEventListener(
            "click",
            function() {

                if (!recognition) {

                    return;

                }


                if (isRecording) {

                    recognition.stop();

                    return;

                }


                try {

                    recognition.start();

                } catch (error) {

                    console.log(
                        "Impossible de démarrer le microphone:",
                        error
                    );

                }

            }
        );

    }


    setupVoice();


    // ========================================================
    // AUTHENTIFICATION
    // ========================================================

    function openLogin() {

        authMode =
            "login";


        authTitle.textContent =
            "Connexion";


        authSubmit.textContent =
            "Se connecter";


        nameContainer.classList.add(
            "hidden"
        );


        passwordInput.autocomplete =
            "current-password";


        authSwitch.textContent =
            "Créer un compte";


        authError.textContent =
            "";


        authModal.classList.add(
            "show"
        );

    }


    function openRegister() {

        authMode =
            "register";


        authTitle.textContent =
            "Créer un compte";


        authSubmit.textContent =
            "Créer mon compte";


        nameContainer.classList.remove(
            "hidden"
        );


        passwordInput.autocomplete =
            "new-password";


        authSwitch.textContent =
            "J'ai déjà un compte";


        authError.textContent =
            "";


        authModal.classList.add(
            "show"
        );

    }


    authSwitch.addEventListener(
        "click",
        function() {

            if (
                authMode ===
                "login"
            ) {

                openRegister();

            } else {

                openLogin();

            }

        }
    );


    authClose.addEventListener(
        "click",
        function() {

            authModal.classList.remove(
                "show"
            );

        }
    );


    accountButton.addEventListener(
        "click",
        async function() {

            try {

                const response =
                    await fetch(
                        "/api/me"
                    );


                const data =
                    await response.json();


                if (data.logged_in) {

                    const shouldLogout =
                        confirm(
                            "Voulez-vous vous déconnecter ?"
                        );


                    if (shouldLogout) {

                        await fetch(
                            "/api/logout",
                            {
                                method: "POST"
                            }
                        );


                        location.reload();

                    }

                } else {

                    openLogin();

                }

            } catch (error) {

                console.log(
                    "Compte:",
                    error
                );

            }

        }
    );


    authSubmit.addEventListener(
        "click",
        async function() {

            authError.textContent =
                "";


            const email =
                emailInput.value.trim();


            const password =
                passwordInput.value;


            const name =
                nameInput.value.trim();


            if (!email || !password) {

                authError.textContent =
                    "Remplis tous les champs.";

                return;

            }


            if (
                authMode ===
                "register"
                &&
                !name
            ) {

                authError.textContent =
                    "Entre ton nom.";

                return;

            }


            authSubmit.disabled =
                true;


            try {

                const endpoint =
                    authMode === "login"
                    ? "/api/login"
                    : "/api/register";


                const body =
                    authMode === "login"
                    ? {

                        email:
                            email,

                        password:
                            password

                    }
                    : {

                        name:
                            name,

                        email:
                            email,

                        password:
                            password

                    };


                const response =
                    await fetch(
                        endpoint,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body:
                                JSON.stringify(body)
                        }
                    );


                const responseText =
                    await response.text();


                let data;


                try {

                    data =
                        JSON.parse(
                            responseText
                        );

                } catch (jsonError) {

                    throw new Error(
                        "Le serveur a renvoyé une réponse inattendue."
                    );

                }


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Erreur de connexion."
                    );

                }


                authModal.classList.remove(
                    "show"
                );


                emailInput.value =
                    "";

                passwordInput.value =
                    "";

                nameInput.value =
                    "";


                await updateUserInterface();

                await loadConversations();


            } catch (error) {

                authError.textContent =
                    error.message;

            }


            authSubmit.disabled =
                false;

        }
    );


    // ========================================================
    // UTILISATEUR
    // ========================================================

    async function updateUserInterface() {

        try {

            const response =
                await fetch(
                    "/api/me"
                );


            const data =
                await response.json();


            if (
                data.success &&
                data.logged_in
            ) {

                accountName.textContent =
                    data.user.name;


                accountEmail.textContent =
                    data.user.email;


                accountButton.textContent =
                    "Se déconnecter";


                return;

            }


            accountName.textContent =
                "Invité";


            accountEmail.textContent =
                "Connecte-toi pour sauvegarder tes conversations.";


            accountButton.textContent =
                "Se connecter";


        } catch (error) {

            console.log(
                "Utilisateur:",
                error
            );

        }

    }


    // ========================================================
    // BOUTONS
    // ========================================================

    document
        .getElementById("newChatButton")
        .addEventListener(
            "click",
            newConversation
        );


    sendButton.addEventListener(
        "click",
        sendMessage
    );


    backToChatButton.addEventListener(
        "click",
        function() {

            sidebar.classList.remove(
                "open"
            );

        }
    );


    promptElement.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
                &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    mobileMenu.addEventListener(
        "click",
        function() {

            sidebar.classList.toggle(
                "open"
            );

        }
    );


    // ========================================================
    // INITIALISATION
    // ========================================================

    async function initialize() {

        await updateUserInterface();

        await loadConversations();

    }


    initialize();

</script></body>
